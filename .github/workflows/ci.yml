name: CI

on:
  pull_request:
  # GitHub merge queue (2026-10-04): every check must also run on the
  # queue's merge_group ref, or a queued PR waits forever for it.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────
# JOB TIMEOUTS (added 2026-08-18)
#
# Every job here previously ran with NO timeout-minutes, so it
# inherited GitHub's 6-hour default. On 2026-08-18 the @shard1 job
# wedged in `npx playwright install --with-deps chromium` (that flag
# shells out to apt-get) and sat there 24+ minutes with the test step
# never starting; it had to be cancelled by hand. On a re-run the same
# job passed in 3m32s. Nothing bounded it, and nothing would have.
#
# Caps below are set from MEASURED durations — 90 job samples across
# the last 10 successful ci.yml runs — not from guesses. The relevant
# statistic is the MAX, not the mean: runner congestion (8+ concurrent
# runs on a busy evening) routinely pushes a job to 2-3x its average,
# and a cap tight enough to catch a hang quickly is also tight enough
# to fail honest jobs on a slow night. These are deliberately loose;
# the goal is to bound a hang, not to police performance.
#
#   tier      cap   observed max   jobs
#   fast      10    0.2 - 0.9 min  syntax, site-integrity, secret-scan,
#                                  functions-parse, unit-manifest, smoke
#   medium    15    1.2 - 5.0 min  firestore-rules, referral-trigger,
#                                  emulator-orphan, visual-brand-tokens
#   heavy     20    1.4 - 5.0 min  public-e2e, visual-regression,
#                                  visual-brand-tokens (loose despite
#                                  low maxima: all three install
#                                  Playwright, the step that wedged)
#   e2e       25    11.5 min       e2e-authed-emulator matrix
#
# FOUR jobs install Playwright, not three: e2e-authed-emulator,
# public-e2e, visual-regression, and visual-brand-tokens. The last one
# does it via `npm run install:browsers` rather than a literal
# `npx playwright install`, so grep for the STEP NAME ("Install
# Playwright chromium") when auditing — matching on the command misses it.
#
# These caps are not theoretical. On the very first run carrying them
# (32088697255), visual-regression and visual-brand-tokens BOTH hit their
# ceiling on `Install Playwright chromium` — the same step that wedged
# @shard1 an hour earlier. Three separate jobs, one evening. Without a
# cap all three would have sat until GitHub's 6-hour default, and the two
# continue-on-error ones would have done it silently.
#
# If a job starts timing out legitimately, RAISE the cap — do not
# remove it. A job with no ceiling is the failure mode this fixes.
# ─────────────────────────────────────────────────────────────

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because tests/catalog-cost-privacy.test.js verifies a
      # recorded cost ROTATION by re-reading the published catalog at the commit
      # the rotation was signed against (tests/cost-basis-ledger.js `basisAt`).
      # A depth-1 checkout does not have that blob, and the guard would fail
      # with "the figures at basisAt cannot be read" — a red about clone depth
      # on the suite that stands between the cost book and the public tree. The
      # secret-scan job already pays this fetch; paying it here too is the price
      # of a pin that cannot be silenced by editing the pin.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Most smoke tests are dependency-free, but the photo-vision sanitizer
      # test does a real `require()` of functions/photo-vision.js, which
      # itself pulls in firebase-functions/v2/https. Install functions deps
      # so that require resolves.
      - name: Install functions deps
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi
      - name: Run smoke tests
        run: node tests/smoke.test.js
      # The 65 suites below used to be 65 hand-written steps. A red step aborts
      # the job, so the first failure hid the other 64 results — the aggregated
      # runner reports every one, with a ::group:: per suite, an ::error:: per
      # failure and a job-summary table. Each suite's rationale moved verbatim
      # into the "smoke" bucket of tests/ci-manifest.json, where a non-empty doc
      # is now ENFORCED (run-test-manifest.js check (e)) instead of being a
      # courtesy comment. Do not add "if:", "continue-on-error:" or "|| true"
      # here — check (d) fails the build, because this one step is what stands
      # between 65 suites and merging ungated.
      # smoke.test.js deliberately keeps its own step above: it is over half the
      # job runtime, and firebase-deploy.yml gates the functions deploy on it.
      - name: Run smoke bucket (65 suites, aggregated)
        run: node scripts/run-test-manifest.js --bucket smoke
      # Cheap second spelling of the leak gate, independent of the privacy
      # suite's regexes — that suite is exactly what failed to look at this
      # file for a month.
      - name: Assert job-templates-data.js carries no contractor costs
        run: node scripts/strip-job-template-costs.js --check

  site-integrity:
    name: Site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Gate the defect classes the 2026-06 manual QC sweep fixed by hand:
      # dead internal links, 404'd assets, broken in-page/cross-page anchors.
      # Zero npm deps (Node builtins only) — no install step needed.
      # firebase.json redirects/rewrites are read at runtime, so hosting
      # config changes can't desync the checker.
      - name: Check links, assets, and anchors (docs/, excluding /pro + /admin)
        run: node scripts/check-site-integrity.js --quiet
      # Vault integrity: INDEX.md grew THREE "- Session handoffs:" lines with
      # five competing "current — start here" claims, because sessions kept
      # prepending to a copy of the line instead of editing the one list — and
      # a session reading the wrong one started from a 10-day-stale brief.
      # Separately, 49 notes had drifted out of reach of INDEX (entry docs
      # named their siblings in backticks, not links), silently breaking
      # CLAUDE.md's "an unlinked note is invisible" rule. Both are valid
      # markdown, so nothing detected either. Archive docs are exempt from the
      # broken-link half only — some dangle on purpose.
      - name: Check vault index (one handoff list, no invisible notes)
        run: node scripts/check-vault-index.js --quiet
      # Chrome governance: apply-partials.js only sees pages that carry a
      # marker, so a page with hand-built nav/footer is invisible to its
      # --check forever. 22 of 211 marketing pages were in that state, which is
      # why every sitewide chrome sweep since 2026-06 left residue on the same
      # ~29 files. This walks the tree and treats its EXEMPT list as a denylist
      # of known-good, so a NEW page defaults to failing — the inversion the
      # three prior guard failures got backwards. Stale exemptions fail too.
      - name: Check chrome governance (nav/footer are generator-owned)
        run: node scripts/check-chrome-governance.js
      # Owner-keyed Storage registry: STORAGE_PREFIXES drives BOTH the GDPR
      # export and the erasure sweep, so a prefix missing from it is silently
      # absent from both — the user can't obtain those objects and a
      # right-to-be-forgotten request doesn't delete them. Four were missing at
      # once on 2026-09-08 (documents, esign, homeowner-uploads, pdf-renders).
      # The old guard compared the registry against a hand-maintained list
      # labelled "all 8 storage.rules prefixes" while storage.rules defined
      # eleven, and being a subset check it could only ever catch a prefix
      # someone had already remembered to type into it. This derives the truth
      # from storage.rules AND the write sites in code — two sources, because
      # pdf-renders/ and homeowner-uploads/ are admin-SDK writes that never had
      # a rules block at all.
      - name: Check owner-keyed Storage registry (GDPR export + erasure scope)
        run: node scripts/check-storage-prefix-registry.js
      # Sitemap drift gate: build-sitemap.js dry-runs by default and exits 1
      # when the generated sitemap differs from docs/sitemap.xml (prints the
      # unified diff). Writes nothing without --write.
      - name: Check sitemap drift (dry-run diff)
        run: node scripts/build-sitemap.js
      # Feed drift gate: build-feed.mjs dry-runs by default and exits 1 when
      # the generated RSS feed differs from docs/feed.xml (same POSTS source
      # and live-post filter as the blog index, deterministic timestamps).
      - name: Check feed drift (dry-run diff)
        run: node scripts/build-feed.mjs
      # llms.txt drift gate: the SERVICES / AREAS / CASE-STUDIES marker regions
      # in docs/llms.txt are generated from docs/services/, docs/areas/ and
      # projects.json; they move only when a page/project is added, removed or
      # retitled. Exits 1 on drift; writes nothing. docs/llms-full.txt is
      # deliberately NOT gated here — it mirrors the text of ~37 pages, so a
      # gate would redden every copy edit; firebase-deploy.yml regenerates it
      # before the Hosting deploy instead.
      - name: Check llms.txt generated regions (dry-run diff)
        run: node scripts/build-llms.mjs --check-regions
      # Featured Projects drift gate: the OURWORK-* regions in docs/our-work.html
      # are generated from assets/data/projects.json. Same rationale as the
      # partial gate below — without this the scheme is advisory.
      - name: Check projects static-block drift (dry-run diff)
        run: node scripts/build-projects.mjs --check
      # Town-page drift gate: the TOWNWHY / TOWNFACTS / TOWNFAQ regions on
      # docs/areas/<town>.html and TOWNLOCAL on the town roof-inspection /
      # siding pages are generated from site-src/data/towns.json (NOAA storms,
      # permits, Census housing age). A hand-edit inside a region, or a data
      # edit without a restamp, fails here.
      - name: Check town-page regions drift (site-src/data/towns.json vs docs/)
        run: node scripts/build-town-pages.mjs --check
      # Shared-partial drift gate. The chrome inside <!-- nbd:partial --> markers
      # is GENERATED from site-src/partials/. Without this gate the whole scheme
      # is advisory: a page could be hand-edited inside a region, or a partial
      # could be changed without restamping, and nothing would notice — which is
      # exactly how 139 pages ended up claiming the wrong city. Writes nothing
      # with --check; exits 1 and prints the offending file + region.
      - name: Check shared-partial drift (site-src/partials vs docs/)
        run: node scripts/apply-partials.js --check --diff
      # Inline-script gate. BIG_ROCKS.md names this checker a must-pass, but
      # neither the checker nor its test ran anywhere in CI (2026-08-05).
      # The checker guards the served pages; the test guards the checker.
      - name: Check inline HTML scripts (docs/)
        run: node scripts/check-inline-html-scripts.js
      # CRM-surface gate (2026-09-03): the top-level docs/pro/*.html pages are
      # excluded from BOTH HTML gates above — check-site-integrity.js skips
      # them via SCAN_EXCLUDED_TOP_DIRS = new Set(['pro','admin']), and
      # check-inline-html-scripts.js via SKIP_DIRS unless --all. So a <script
      # src> or <link href> pointing at a deleted file under the CRM merged
      # with nothing looking at it. crm-audit.js walks those pages (zero deps,
      # sub-second) and was referenced by no workflow.
      #
      # Invoked BARE for a readable log. --severity/--quiet filter only what is
      # PRINTED — totErr counts over ALL findings — so neither can narrow the
      # verdict; do not add one thinking it scopes the gate. (--json exits on
      # the same verdict too, as of the 2026-09-03 fix; before that it returned
      # before the verdict was ever computed and ALWAYS exited 0. See the EXIT
      # CONTRACT block in scripts/crm-audit.js and tests/crm-audit.test.js,
      # which pins both that and the refusal to pass over zero matched pages.)
      #
      # No "if:", no "continue-on-error:", no "|| true" — that is how this
      # repo's other gates went silently green.
      #
      # SCOPE, honestly: this makes the CRM pages VISIBLE, not protected.
      # Two gaps remain, both deliberate and both tracked in the 09-04 handoff:
      #   1. It reads only the 27 top-level docs/pro/*.html. The 7 nested pages
      #      (docs/pro/blog/*.html, docs/pro/daily-success/) and docs/admin/**
      #      are still guarded by nothing. Widening discovery may surface new
      #      findings, so it belongs in its own attributable red.
      #   2. This is ci.yml. The deploy runs from firebase-deploy.yml, which has
      #      no `needs:` on this workflow and whose own pre-flight runs only
      #      check-js-syntax / check-site-integrity / apply-partials. So a break
      #      here still DEPLOYS; this step just turns red beside it. Adding it
      #      to that pre-flight is the follow-up, after this has run green on
      #      main a few times — a false positive there blocks the whole site.
      - name: Check CRM pages (top-level docs/pro/*.html — scripts, styles, handlers, anchors)
        run: node scripts/crm-audit.js
      # Image-privacy gate (2026-08-10): published images must carry no EXIF
      # GPS — three gallery JPEGs shipped with customer-property coordinates
      # because nothing verified the committed bytes after
      # prepare-project-images.mjs was bypassed. Zero deps, byte-level scan.
      - name: Check image privacy (EXIF/GPS strip invariant)
        run: node scripts/check-image-privacy.js
      - name: Run inline-html-scripts checker tests
        run: node tests/inline-html-scripts.test.js
      # Marketing-surface polish contract (headings, empty src, alt text …)
      # over the served docs/ pages — same zero-install shape as this job.
      - name: Run marketing polish contract tests
        run: node tests/marketing-polish-contract.test.js
      # Icon-CSS link contract (2026-08-07): every page using svg.ico /
      # svg.nav-ico must link the shared /assets/css/nbd-icons.css (the old
      # per-page injected <style> duplicated ~1.1 KB × 185 pages).
      - name: Check icon-CSS links (assert mode)
        run: node scripts/ensure-icon-css.js
      # Nav-CSS block contract (2026-08-17): every page with header-nav markup
      # (dropdown-menu / mobile-nav / hamburger) must carry the "nav base
      # (injected)" style block. 18 hand-built pages (the-pledge, areas index,
      # 7 product pages, 9 blog posts) shipped without it — the Services
      # dropdown rendered permanently expanded over the page header and the
      # mobile hamburger/collapse never worked.
      - name: Check nav-CSS blocks (assert mode)
        run: node scripts/ensure-nav-css.js
      # Readability-CSS extraction contract (2026-09-18): the nbd-readability-v2
      # rules live in /assets/css/nbd-readability.css, linked IN PLACE of the
      # old inline block (it sits before nbd-mobile.css, and moving it flips
      # equal-specificity !important ties). Fails on a re-injected inline
      # canonical copy or a page carrying both the link and the marker.
      - name: Check readability-CSS extraction (assert mode)
        run: node scripts/ensure-readability-css.js
      # nav-responsive-fix v3 extraction (2026-09-22, dedup slice 4): the block
      # was byte-identical inline CSS on 173 pages (~151 KB of HTML). Same
      # contract and same reason as readability above — every rule in it is
      # !important and nbd-mobile.css carries its own !important nav padding,
      # so the link must stay exactly where the <style> was. Fails on a
      # re-injected inline copy or a page carrying both the link and the marker.
      - name: Check nav-responsive-CSS extraction (assert mode)
        run: node scripts/ensure-nav-responsive-css.js
      # nbd-social-v1 extraction (2026-09-23, dedup slice 5): 198 pages carried
      # the footer social strip byte-identically (~178 KB of HTML); 192 migrated.
      # Unlike slice 4 this block HAS a generator — add-social-footer-strip.js —
      # which guarded on the marker and would have re-inlined the block into
      # every migrated page once the marker became a link. It now skips the link
      # too, and this assert is what fails if that ever regresses.
      - name: Check social-CSS extraction (assert mode)
        run: node scripts/ensure-social-css.js
      # footer-contrast extraction (2026-09-24, dedup slice 6): 195 pages carried
      # it byte-identically (~146 KB of HTML). Ordering is load-bearing here —
      # nbd-readability.css sets the SAME properties on the SAME selectors with
      # !important on both sides, so source order alone picks the footer colour,
      # and the block's position differs per page. The link replaces the <style>
      # in place; this assert fails if it is ever re-inlined or the sheet drifts.
      - name: Check footer-contrast-CSS extraction (assert mode)
        run: node scripts/ensure-footer-contrast-css.js
      # shrink-logo extraction (2026-09-24, dedup slice 7): 223 pages carried one
      # 69-byte declaration as its own inline <style> (~29 KB). Cleanest population
      # of the series — one byte-exact body, one copy per page, never in a partial
      # region. Deliberately its OWN sheet, not folded into nbd-nav-responsive.css:
      # 51 of the 223 pages never link that sheet, and its identical-looking rule
      # sits under a disjoint breakpoint (1025-1440 vs max-width:768).
      - name: Check nav-logo-mobile-CSS extraction (assert mode)
        run: node scripts/ensure-nav-logo-mobile-css.js
      # Favicon contract (2026-09-13): two icons across every page, by
      # audience — the roof mark (/favicon.svg + /assets/images/apple-touch-icon.png)
      # for homeowner pages, NBD PRO (/pro/favicon.svg + /pro/img/nbd-icon-192.png)
      # for /pro, /admin and /tools, with a short override map for pages whose
      # audience is not their directory's. A denylist WALK, not a page list, so
      # a new page is covered the day it lands; Oaks and the tenant template are
      # excluded and must carry no NBD icon. Before this, 31 of 36 CRM pages flew
      # the homeowner favicon and 13 pages had none.
      # documentation/audit/FAVICON-NORMALIZATION-2026-09-13.md
      # 2026-09-27: homeowner-site pages (not pro/**) now carry a six-line block —
      # the SVG, a sized apple-touch icon, 192/512 lettered PNG icons, the
      # /manifest.webmanifest link and the apple-mobile-web-app-title meta.
      - name: Check favicon pairs (two icons, by audience)
        run: node scripts/normalize-favicons.js --check
      # Manifest completeness tripwire (2026-08-07): every tests/*.test.js
      # must be classified in tests/ci-manifest.json — a new suite that isn't
      # bucketed fails here instead of silently never running (35 suites,
      # including every money/pricing suite, were orphaned this way).
      - name: Check test-suite manifest completeness
        run: node scripts/run-test-manifest.js --check

  # The node suites the manifest owns (32 at wiring on 2026-08-07; 43 by the
  # 2026-08-23 smoke collapse). The live count is deliberately NOT repeated
  # here — it rots: this comment claimed 44 while the bucket held 96, and
  # claimed 43 at wiring when the real figure was 32. FLOORS in
  # run-test-manifest.js is the one copy, and since 2026-09-07 (#1481) it is
  # enforced in both directions, so it cannot drift again. These existed for
  # months without gating anything — tests/package.json's `npm test`
  # aggregate was never invoked by CI, and nobody hand-listed them. All 32
  # verified green at wiring time; quarantine (with a dated reason in the
  # manifest) rather than wiring red.
  unit-suite-manifest:
    name: Unit suites (manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Most of the bucket is dependency-free, but expenses-logic requires
      # functions/receipt-vision.js (→ firebase-functions) and
      # webhook-signatures requires functions/node_modules/stripe by path —
      # same rationale as the smoke-tests job's install.
      - name: Install functions deps
        run: |
          cd functions
          npm ci --silent || npm install --silent --no-audit --no-fund
      # Explicit --bucket: a bare invocation defaulting to a bucket is how a
      # rename would silently move execution off this job's shallow checkout.
      - name: Run manifest node bucket
        run: node scripts/run-test-manifest.js --bucket node

      # Behavioral tests for the strict functions-deploy step in
      # firebase-deploy.yml — it is shell inside YAML, so nothing else can
      # actually execute it. Three false-green modes have shipped from that
      # step, two of them found by deploying to prod and noticing afterwards.
      # Dependency-free, no network, no credentials, runs in seconds; it
      # extracts the real run: block and drives it against a stand-in CLI.
      # Rides this job rather than its own because it needs neither the deps
      # installed above nor a runner of its own.
      # See tests/deploy-step/README.md.
      - name: Deploy-step guards (false-green regressions)
        run: bash tests/deploy-step/run.sh

  # The three auth/firestore-emulator suites the manifest classifies as
  # emulator-bucket (2026-08-07; the fourth, portal-token, rides the
  # referral-trigger job's functions-emulator recipe). Same v13 global
  # firebase-tools shape as the firestore-rules job — none boots functions.
  emulator-orphan-suites:
    name: Auth/Firestore emulator suites (rate-limit, auth-access, lead-lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent
      # rate-limit.test.js drives functions/rate-limit.js directly, which
      # requires firebase deps from functions/node_modules.
      - name: Install functions deps
        run: |
          cd functions
          npm ci --silent || npm install --silent --no-audit --no-fund
      - name: Install firebase-tools globally
        run: npm install -g firebase-tools@13
      - name: Run rate-limit persistence tests under firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-test-ratelimit 'node ./rate-limit.test.js'
      - name: Run auth-access matrix tests under auth+firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only auth,firestore --project nbd-test-authaccess 'node ./auth-access.test.js'
      - name: Run lead-lifecycle tests under auth+firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only auth,firestore --project nbd-test-leadlifecycle 'node ./lead-lifecycle.test.js'
      # claimInvite + onRepSignup accept only a real companies/{id}/members
      # invite (2026-09-25): both run in-process against these emulators, so
      # this job's functions deps are all it needs (no functions emulator).
      - name: Run invite-claim path-check tests under auth+firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only auth,firestore --project demo-nbd-invite 'node ./invite-claim-path.integration.test.js'
      # Thursday (Bland AI receptionist) call pipeline, 2026-09-26: the real
      # webhook / processing trigger / inbox callables run in-process against
      # the firestore emulator with Bland + Claude stubbed at fetch.
      - name: Run Thursday call-pipeline tests under firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project demo-nbd-thursday 'node ./thursday-pipeline.integration.test.js'
      # R1-10-8 (2026-10-05): these four sat in the node bucket with their
      # end-to-end section behind FIRESTORE_EMULATOR_HOST, which that job never
      # sets, so every CI run printed "skipped". They run here instead, in
      # process against the firestore emulator (no functions emulator, so no
      # secrets are loaded). NBD_REQUIRE_EMULATOR=1 makes each suite FAIL, not
      # skip, if the emulator is missing, and assert its section's full count.
      - name: Run bot API end to end (another company's customer refused, KY wording refused on the server) under firestore emulator
        env:
          NBD_REQUIRE_EMULATOR: '1'
        run: |
          cd tests
          firebase emulators:exec --only firestore --project demo-nbd-agentmcp 'node ./agent-mcp-2026-10-02.test.js'
      - name: Run bot roles v2 end to end (storm/profit/post-job read only this company) under firestore emulator
        env:
          NBD_REQUIRE_EMULATOR: '1'
        run: |
          cd tests
          firebase emulators:exec --only firestore --project demo-nbd-agentroles 'node ./agent-mcp-roles-v2-2026-10-02.test.js'
      - name: Run personal-key scope end to end (owner's tracker only, no CRM tools) under firestore emulator
        env:
          NBD_REQUIRE_EMULATOR: '1'
        run: |
          cd tests
          firebase emulators:exec --only firestore --project demo-nbd-agentpersonal 'node ./agent-personal-keys-2026-10-02.test.js'
      - name: Run call-watch end to end (own calls only, quiet repeat, carrier delivery stamped) under firestore emulator
        env:
          NBD_REQUIRE_EMULATOR: '1'
        run: |
          cd tests
          firebase emulators:exec --only firestore --project demo-nbd-callwatch 'node ./call-watch-2026-10-02.test.js'

  syntax-check:
    name: Node syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Parse-checks every FIRST-PARTY shipped .js under functions/ + docs/.
      #
      # This used to be an inline `for f in $(find functions docs/pro/js ...)`
      # loop, which left ~80 shipped files unchecked by anything in CI — most
      # importantly all of docs/assets/js/inline/, the directory the CSP sweeps
      # moved every former inline <script> and on*= handler into. A syntax
      # error there renders a page dead with nothing else in CI noticing.
      #
      # The script widens coverage to all of docs/ (excluding assets/vendor,
      # _archive, node_modules), and is ~6x faster than the serial loop because
      # it runs a CPU-sized pool instead of one blocking spawn per file. It is
      # also the pre-Hosting gate in firebase-deploy.yml, which runs it with
      # --shipped-only.
      #
      # 2026-09-25: it also parses tests/** (specs, e2e fixtures, unit suites,
      # helpers). A PR whose merge with main left a duplicate `const { devices }`
      # in tests/e2e/phone-views.spec.js passed every Node gate — nothing parsed
      # tests/e2e, so only the E2E shard would have caught it. Do NOT add
      # --shipped-only here; tests/smoke/functions.test.js pins that.
      - name: Parse every first-party .js (shipped + tests)
        run: node scripts/check-js-syntax.js

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent
      - name: Install firebase-tools globally
        run: npm install -g firebase-tools@13
      - name: Run Firestore rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-rules-test 'node firestore-rules.test.js'
      - name: Run cross-tenant isolation rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-xtenant-test 'node firestore-rules.cross-tenant.test.js'
      # Communication Log producer→index→consumer contract (customer page).
      # Broke silently once (log permanently empty): producers wrote neither
      # leadId nor `date` while the consumer queried {leadId, uid, orderBy date}.
      - name: Run Communication Log contract test under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-commlog-test 'node communication-log-contract.test.js'
      - name: Run Storage rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only storage --project nbd-storage-test 'node storage-rules.test.js'

  # Referral-CODE $200-bonus trigger. Previously ONLY runnable by hand
  # (emulators:exec locally) — so the money-path bugs the 2026-07-08 sweep found
  # shipped unseen (#894/#897). Gated here: drives the REAL onReferralLeadWrite
  # trigger in the functions+firestore emulator, so attribution / credit-on-close /
  # tenant-scope / idempotency regressions fail the PR.
  referral-trigger:
    name: Referral trigger tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Firestore emulator runs on the JVM; firebase-tools needs a modern JDK
      # (same setup as the @stranger E2E shard that boots the functions emulator).
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent
      - name: Install functions deps (the emulator must load the onReferralLeadWrite trigger)
        run: |
          cd functions
          npm ci
      - name: Emulator-safe functions env (dummy secrets + onRepSignup skip)
        # Writing a lead fires EVERY leads/{leadId} trigger; the ~34 secret-declaring
        # functions can't reach Secret Manager in CI (no ADC), so without overrides
        # they fail to load and wedge the work queue — onReferralLeadWrite never
        # lands. Generate a .secret.local with dummy values (auto-covers new secrets)
        # so all functions load + run; the trigger under test uses no secrets. Also
        # skip the GCIP-blocked onRepSignup (prod never runs it).
        # TURNSTILE_SECRET is deliberately excluded: a PRESENT (even dummy)
        # secret flips verifyTurnstile into configured mode, which fail-closes
        # every tokenless submitPublicLead call with 403 — the lead-bridge
        # integration test's gateway leg needs the unset-secret passthrough.
        # An unset secret loads fine under the v15 emulator (warning only).
        run: |
          grep -rhoE "defineSecret\(['\"][A-Z_]+['\"]" functions --include=*.js \
            | sed -E "s/.*defineSecret\(['\"]([A-Z_]+)['\"].*/\1=emulator-dummy/" \
            | grep -v '^TURNSTILE_SECRET=' \
            | sort -u > functions/.secret.local
          echo "wrote $(wc -l < functions/.secret.local) dummy secrets"
          node tests/e2e/fixtures/ensure-emulator-env.js
      - name: Run referral-rewards trigger test under functions+firestore emulator
        # Use the tests devDependency firebase-tools (v15+, same as the @stranger
        # shard that boots functions in CI). The global v13 the firestore-only jobs
        # install does NOT read functions/.secret.local, so functions crash-loop
        # without secret access (no ADC in CI) and onReferralLeadWrite never fires.
        # v15 reads .secret.local, so all functions boot with the dummy values above.
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-pl 'node referral-rewards.test.js'
      - name: Run lead-bridge integration test under functions+firestore emulator
        # Public lead → CRM mirror, end to end through the real trigger. Was
        # authored with this exact recipe in its RUN header but never wired
        # anywhere (2026-08-05). Reuses this job's JDK + functions deps +
        # dummy-secret env; a second emulators:exec session boots fresh.
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-pl 'node lead-bridge.integration.test.js'

      - name: Run lead-artifact-cleanup integration test under functions+firestore+storage emulator
        # onLeadDeleted end to end through the real trigger (2026-09-13): a
        # hard-deleted lead's linked Cal.com appointments/{id} docs must be
        # swept too, or a booking outlives the lead it points at forever (no
        # client UI deletes an appointments/{id} doc directly, and Firestore
        # never cascades into a sibling top-level collection). Proved red
        # against the pre-fix trigger before this was wired. Reuses this
        # job's JDK + functions deps + dummy-secret env; a fresh
        # emulators:exec session boots for this suite, same as the two above.
        # 2026-09-25: + storage. The trigger now sweeps the lead's whole
        # subtree, each row's Storage objects before the row, and the suite
        # asserts on real objects; it exits 1 if no storage emulator is up.
        # Neither Storage-triggered function does anything with the objects
        # the test writes: since its review fixes (2026-09-25) it also writes
        # under photos/ and audio/, but every object is text/html (the image
        # pipeline returns at its image/* check), and onAudioUploaded is bound
        # to the production bucket name, not this project's. It also runs
        # functions/portal.js in-process (section P), which needs no emulator.
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore,storage --project demo-nbd-pl 'node lead-artifact-cleanup.integration.test.js'

      # Public-intake gateway suite (submitPublicLead: honeypot both-keys,
      # field allowlist, contact-kind allowlist, silent-200 semantics). Ran in
      # the local chain but not CI (NEXT_SESSION-2026-08-05 item 8). Reuses
      # this job's recipe — the dummy-secret step above already excludes
      # TURNSTILE_SECRET, which this suite's tokenless legs require.
      - name: Run public-intake gateway tests under functions+firestore emulator
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-pl 'node public-intake.test.js'

      # Portal token-surface suite (mintPortalLink → validate → revoke).
      # Manifest emulator-bucket (2026-08-07): needs the functions emulator,
      # so it reuses this job's JDK + functions deps + dummy-secret env
      # exactly like the two suites above; a fresh emulators:exec boots it.
      - name: Run portal-token tests under functions+firestore emulator
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-portal 'node portal-token.test.js'

  functions-parse:
    name: Functions parse + dep install
    runs-on: ubuntu-latest
    # Raised 10 -> 20 on 2026-09-03. This job became a REQUIRED status check
    # when branch protection went on, and within hours it deadlocked every
    # merge: `Install functions deps (CI)` ballooned from its usual ~20s to
    # 4-7 minutes against a slow npm registry, `npm audit` then ate the
    # remainder, and the 10-minute cap cancelled the job three runs in a row —
    # on a PR touching zero files under functions/. A `cancelled` conclusion
    # does not satisfy a required check, and ci.yml has no path filters, so
    # nothing could merge. The cap had been tuned against an "observed max
    # 0.2-0.9 min" sample that no longer holds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions deps (CI)
        # `npm ci` requires the lockfile to match package.json exactly.
        # When a feature branch adds deps but we haven't regenerated the
        # lock yet, fall back to `npm install` instead of failing CI.
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi

      - name: Require every integration module
        run: |
          cd functions
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('integrations').filter(f => f.endsWith('.js'));
            for (const f of files) {
              try {
                require('./integrations/' + f);
                console.log('OK ', f);
              } catch (e) {
                console.error('FAIL ', f, e.message);
                process.exit(1);
              }
            }
          "

  # Split out of `Functions parse + dep install` on 2026-09-03, and NOT added
  # to branch protection's required checks — deliberately, for two reasons:
  #
  #  1. `npm audit` is a live call to registry.npmjs.org. As a step inside a
  #     required job it made merges hostage to third-party latency; it was the
  #     second half of the deadlock described on that job.
  #  2. Its result changes with NO change to this repo. npm publishes an
  #     advisory overnight and a previously-green required check goes red on
  #     code nobody touched. A blocking gate that fires on someone else's
  #     timetable gets bypassed with `--admin` until it is ignored entirely,
  #     which is worse than an advisory one that is actually read.
  #
  # It still RUNS on every PR and still goes visibly red, so the signal is
  # intact — only its ability to deadlock the merge queue is removed. If a
  # HIGH/CRITICAL appears, it is still a P1; see functions/NPM_AUDIT_ACCEPTED.md
  # for why the known LOW/MODERATE transitive advisories are accepted (each is
  # a transitive dep of firebase-admin / @google-cloud/* whose vulnerable path
  # is unreachable from our handlers, and the only fixes are
  # `npm audit fix --force` downgrades that regress firebase-admin to 10.x and
  # break multi-tenant + App Check).
  functions-audit:
    name: Dependency audit (high and above)
    runs-on: ubuntu-latest
    # 20 not 15: dep install runs ~4 min and the retry path above can spend up
    # to 3x180s of audit plus 120s of backoff before it fails closed. At 15 the
    # runner would kill the job mid-retry and the explicit "the audit DID NOT
    # RUN" message would never be printed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions deps
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent --no-audit --no-fund || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi
      - name: Audit dependencies (high and above)
        run: |
          cd functions
          # `npm audit` exits 1 for TWO unrelated facts: "there is a HIGH or
          # CRITICAL advisory" and "registry.npmjs.org's audit endpoint did not
          # answer". Collapsing both into one exit code is what made this check
          # red three times on 2026-09-04 alone — a 400 on the retiring
          # /-/npm/v1/security/audits/quick endpoint, then two 503s (PR #1373,
          # on commits whose diff does not touch functions/package-lock.json;
          # the lockfile is byte-identical to main). The job comment above
          # already names the failure mode this feeds: a check that fires on
          # someone else's timetable stops being read.
          #
          # So separate the two. Retry ONLY the endpoint-unavailable case, and
          # never swallow it: if the audit still cannot run, the step fails with
          # a message saying the audit did not happen. A security gate that
          # reports success over an audit it never performed is worse than one
          # that is occasionally red — the same false-green reasoning that keeps
          # `|| true` off this line.
          # Each attempt is bounded: the 2026-09-04 400 hung for 7 minutes before
          # npm gave up, which on its own would eat the job budget. `timeout`
          # exits 124 when it kills a call, and that is an endpoint problem too
          # — it must NOT fall through to the advisory branch and accuse the
          # lockfile of something the audit never found.
          for attempt in 1 2 3; do
            rc=0
            out="$(timeout 180 npm audit --audit-level=high 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$out"
              exit 0
            fi
            printf '%s\n' "$out"
            if [ "$rc" -eq 124 ] || printf '%s' "$out" | grep -q 'audit endpoint returned an error'; then
              echo "::warning::npm audit endpoint unavailable (attempt $attempt/3) — retrying in $((attempt * 20))s"
              sleep "$((attempt * 20))"
              continue
            fi
            echo "::error::npm audit found an advisory at HIGH or above — see the output above. This is a P1; functions/NPM_AUDIT_ACCEPTED.md covers only the known LOW/MODERATE transitives."
            exit 1
          done
          echo "::error::npm audit endpoint still unavailable after 3 attempts — the audit DID NOT RUN. Failing closed rather than reporting green over an audit that never happened."
          exit 1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Simple grep — fast first-pass for obvious patterns. Catches
      # the big ones before a push even completes.
      - name: Grep for obvious secrets
        run: |
          set -e
          echo "== Checking for committed private keys / tokens =="
          ! grep -rE '(-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|sk_live_[A-Za-z0-9]+|sk-ant-[A-Za-z0-9-]{20,}|SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|ghp_[A-Za-z0-9]{36})' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=_archive --include='*.js' --include='*.html' --include='*.json' --include='*.md' .

      # Q5: full gitleaks scan — catches 130+ secret formats the
      # grep above doesn't (GCP SA JSON, Slack webhook, JWTs with
      # recognizable signatures, etc.). Runs against the whole
      # history so a secret that slipped in before gitleaks was
      # wired surfaces now.
      #
      # If this starts failing on legitimate matches, add an entry
      # to .gitleaksignore with the full fingerprint line from the
      # scanner output.
      # 2026-10-04: the repo moved to the NBDPRO organization, and
      # gitleaks-action@v3 requires a paid license for organizations.
      # The gitleaks CLI itself is free (MIT): run it directly, scanning
      # the same commit range the action did (the PR / merge-group /
      # push range), honouring .gitleaksignore.
      - name: gitleaks scan
        env:
          GITLEAKS_VERSION: 8.21.2
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
          fi
          echo "gitleaks range: ${RANGE}"
          ./gitleaks git --redact --verbose --log-opts="${RANGE}" .

  e2e-authed-emulator:
    name: Authed E2E (emulators, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Highest cap in the file: this matrix owns the widest spread
    # (measured max 11.5 min on @shard1) AND installs Playwright, the
    # step that wedged on 2026-08-18. 25 leaves >2x headroom over the
    # worst honest run while still killing a hang inside the hour.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # '@audit' = tests/e2e/dashboard-actions-audit.spec.js — full
        # data-action wiring + mobile tap audit (2026-07-05). Its own
        # emulator session, same flake-isolation rationale as the shards.
        # '@stranger' = tests/e2e/stranger.spec.js — the Stranger Test:
        # the full second-contractor lifecycle (provision → operate →
        # microsite → team → isolation) against the FULL emulator rig,
        # functions included (2026-07-06).
        # '@gauntlet' = tests/e2e/gauntlet-lifecycle.spec.js — the e2e-debt
        # specs (persona resolution, lapse seat pause/restore, access-code
        # redemption, multi-rep own-only + seat cap). Boots functions like
        # @stranger; introduced advisory 2026-07-17, promoted to REQUIRED
        # 2026-07-28 with the rest of the matrix — see the ALL FIVE ARE NOW
        # REQUIRED note below.
        # '@engines' = tests/e2e/d2d-engine.spec.js + estimate-engine.spec.js
        # — the lazy-bundle assembly proofs (D2D shim surface, 222-product /
        # 298-key catalog snapshot). Authored with the shard recipe but never
        # wired (2026-08-07 audit). Advisory on introduction; PROMOTED
        # 2026-08-26 on a 10/10 green streak (ledger in
        # documentation/projects/WEEKLY_CADENCE.md).
        # 2026-10-03: + boot-weight.spec.js and tenant-filename-prefix.spec.js
        # (lazy-bundle / boot-path proofs, functions-less). Both sat in the
        # authed-emu file list untagged since 2026-09-06, so no shard ran
        # them; run-test-manifest.js check (c) now reads THIS list and fails
        # on an untagged authed spec instead of silently skipping.
        shard: ['@shard1', '@shard2', '@audit', '@stranger', '@gauntlet', '@engines']
    # Rock 3: hermetic authed journey — seed a tenant in the Auth/Firestore
    # emulators, serve docs/ from the hosting emulator (the client SDK
    # auto-connects to emulators on localhost via nbd-emulator-connect.js),
    # and run pro-authed.spec.js against it. No prod credentials involved.
    #
    # @stranger was promoted to REQUIRED first (gauntlet 2026-07-16): it is the
    # ONLY runtime proof anywhere in CI that a stranger can self-provision
    # (register → createCompany → onboarding → claimInvite → isolation). The
    # legacy shards run functions-LESS and explicitly allowlist createCompany
    # connection-refusals, so with it advisory, a regression that bricked
    # new-tenant signup merged green.
    #
    # ALL FIVE ARE NOW REQUIRED (2026-07-28). The remaining four were held
    # advisory "until they earn the same promotion" — they have now earned it:
    # across all 60 CI runs on main since the 2026-07-08 knock→lead poll-race
    # fix (#912), @shard1, @shard2 and @audit are 60/60 green and @gauntlet is
    # 59/59 (+1 cancelled). The only shard to fail even once in that window is
    # @stranger — the one that was already blocking.
    #
    # That last documented flake class was a TEST-side race, not a product bug
    # (the poll broke on convertedToLead before the separate _saveLead
    # back-link write landed), and it was fixed at the source rather than
    # absorbed by this flag. That is the bar for promotion: fix the race, prove
    # it green, then make it blocking — not the reverse.
    #
    # Left advisory, these were worse than nothing: they burn ~5 runners a push
    # and a real regression in any of them still merges green, so the signal
    # was being produced and then discarded. To re-park a shard that starts
    # flaking, prefer fixing the race; if you must, add a per-shard exclusion
    # here and record WHY, as the @stranger promotion note above does.
    #
    # FLAKE CLASS + FIX (2026-07-05): with 16 serial journeys in ONE
    # emulator session, the Java Firestore emulator intermittently dropped
    # reads ('client is offline') and a rotating single test exhausted its
    # retries each run (#842 rounds 4-9; every deterministic failure found
    # in those rounds was a real bug and was fixed separately). The fix is
    # THIS matrix: the suite is split into @shard1/@shard2 title tags
    # (tests/e2e/pro-authed.spec.js), each shard running in its own
    # emulator session at roughly half load, selected via PLAYWRIGHT_GREP.
    # If a rotating victim reappears, split further or slim the per-test
    # dashboard boot - do NOT chase individual tests.
    # ALL SIX shards REQUIRED — five since 2026-07-28; @engines promoted
    # 2026-08-26 after 10/10 green on main (streak deliberately recounted
    # from the 2026-08-19 Playwright-CDN cancellations: a required job that
    # hangs on a CDN stall is a blocked merge, and only the 20-min caps
    # make that a fast red instead of a wedge). Ledger in
    # documentation/projects/WEEKLY_CADENCE.md.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The Firestore emulator runs on the JVM; firebase-tools 15+ (the tests
      # devDependency) requires JDK 21 — same setup as firebase-deploy.yml.
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      # The Stranger Test shard boots the FUNCTIONS emulator — the emulated
      # runtime loads functions/index.js, so its dependencies must be
      # installed there (and only there; legacy shards run functions-less).
      - name: Install functions deps (functions emulator runtime)
        if: matrix.shard == '@stranger' || matrix.shard == '@gauntlet'
        run: |
          cd functions
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - name: Run authed E2E against emulators
        env:
          PLAYWRIGHT_GREP: ${{ matrix.shard }}
          # The FUNCTIONS emulator boots only for the Stranger Test shard —
          # its ~140-function runtime measurably slows dashboard settle and
          # widened the documented 301-hop "execution context destroyed"
          # race in the legacy shards on the first full-rig run. The legacy
          # shards keep their tuned functions-less environment (callable
          # connection-refusals are allowlisted there); widening functions
          # to all shards is future work once boot cost is addressed.
          NBD_EMU_FUNCTIONS: ${{ (matrix.shard == '@stranger' || matrix.shard == '@gauntlet') && '1' || '' }}
        run: |
          cd tests
          npm run test:e2e:authed:emu
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-authed-traces-${{ strategy.job-index }}
          path: tests/test-results/
          retention-days: 7

  # Public-surface E2E (2026-08-07 audit): marketing.spec.js + pro-public.
  # spec.js existed with a ready-made npm script but were wired NOWHERE.
  # E-sign suites. Browser-driven, but NOT playwright.config.js specs — each
  # file is a plain node script that spins its own static server and drives
  # Chromium directly, so there is no baseURL and no hosting emulator.
  #
  # They live in the manifest's "wired-individually" bucket, and THIS is the
  # wiring. Putting them in the node bucket instead would have been quieter
  # and wrong: that job installs no Playwright, and every one of these files
  # degrades to "render assertions SKIPPED" when playwright is unresolvable —
  # so they would have reported green while testing nothing. This repo has
  # shipped that exact failure before (visual baselines never committed,
  # npm test skipping 22 suites), which is why the graceful skip is a
  # developer convenience and never the CI path.
  #
  # What they actually gate:
  #   esign-stamp               — ink lands where pdf.js predicts, INCLUDING on
  #                               a /Rotate 90 page. This is the coordinate
  #                               contract between the placement UI and the
  #                               server stamper; nothing else pins it.
  #   esign-signer-flow         — the homeowner path end to end, then feeds what
  #                               the page POSTs through the real stamper.
  #   esign-setup-placement     — the rep's field placement, and the round trip
  #                               that a box drawn at any zoom persists to the
  #                               same PDF coordinates.
  #   esign-signature-reachable — the generated-contract signature block is not
  #                               clipped out of the page (it was, for months).
  #   esign-setup-void          — the rep's "Void this link" button: shown only
  #                               for a live (sent/viewed) link, calls
  #                               voidEsignEnvelope, hides itself once voided.
  esign-suites:
    name: E-sign suites (Chromium)
    runs-on: ubuntu-latest
    # Generous vs the ~2 min measured local run: this job installs Playwright,
    # so it carries the same wedge exposure as the E2E jobs above.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # pdf-lib: the stamping engine under test is required directly from
      # functions/, the same way webhook-signatures reaches for stripe.
      - name: Install functions deps
        run: |
          cd functions
          npm ci --silent || npm install --silent --no-audit --no-fund
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      # Run from tests/ so `require('playwright')` resolves, and run each
      # explicitly — no glob, so a renamed file fails loudly here rather than
      # silently dropping out of the run.
      - name: Run e-sign suites
        run: |
          cd tests
          node esign-stamp.test.js
          node esign-signer-flow.test.js
          node esign-setup-placement.test.js
          node esign-setup-void-2026-09-16.test.js
          node esign-signature-reachable.test.js

  # Same "wired-individually" contract as esign-suites above: a plain node
  # script that spins its own static server + drives Chromium directly, no
  # playwright.config.js baseURL involved. Separate job (not folded into
  # esign-suites) because it isn't an esign suite — it gates
  # customer-realtime.module.js's mountMessages() mount/cleanup lifecycle
  # (2026-09-17, mobile job-detail Messages tab): that a re-mount after
  # cleanup() doesn't double-fire replyToPortalMessage, and that BOTH the
  # desktop (#msgUnreadBadge) and mobile (#mJdMsgBadge) unread badges update
  # from one real onSnapshot render pass. No functions/ deps needed (no
  # pdf-lib usage), so it skips that install step esign-suites has.
  mobile-realtime-suite:
    name: Mobile realtime suite (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - name: Run mobile realtime suite
        run: |
          cd tests
          node customer-realtime-mount-lifecycle.test.js

  # CRITICAL RECIPE NOTE: tests/playwright.config.js defaults baseURL to
  # PRODUCTION — PLAYWRIGHT_BASE_URL must stay pinned to the hosting
  # emulator here or this job smoke-tests the live site. Advisory on
  # introduction; PROMOTED 2026-08-26 on a 10/10 green streak (ledger in
  # documentation/projects/WEEKLY_CADENCE.md).
  public-e2e:
    name: Public-surface E2E (hosting emulator)
    runs-on: ubuntu-latest
    # 20 despite a 2.3 min measured max: this job installs Playwright,
    # so it is exposed to the same wedge as the E2E matrix. Now that the
    # job is required, this cap is what turns a hung install into a
    # 20-minute red instead of a 6-hour blocked merge.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      # webkit as well as chromium since 2026-09-08: nav-drawer.spec.js runs
      # on the mobile-webkit project because the drawer's failure modes are
      # iOS-shaped (100vh, fixed overflow scrolling, body scroll locks) and
      # Chromium hides all of them. Adds ~1 min to a job whose measured max
      # is 2.3 min against a 20 min cap.
      - name: Install Playwright chromium + webkit
        run: |
          cd tests
          npx playwright install --with-deps chromium webkit
      - name: Run public-surface specs against the hosting emulator
        run: |
          cd tests
          npx firebase-tools emulators:exec --only hosting --project nobigdeal-pro \
            'PLAYWRIGHT_BASE_URL=http://127.0.0.1:5000 playwright test --config=playwright.config.js --workers=1 pro-public.spec.js marketing.spec.js nav-drawer.spec.js'
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-public-traces
          path: tests/test-results/
          retention-days: 7

  # Rendered QC sweep over the 208-page homeowner surface (2026-08-18).
  # Every other docs/ gate is grep-shaped and cannot compute a style, so
  # cascade-order and layout defects have shipped four times and were caught
  # by eye, not CI — most recently svg.ico rendering at 1227px on
  # /sites/free-guide. This renders each page at 1280px and 390px and asserts
  # the signatures those four share: oversized inline SVG, icon ink matching
  # its own chip background, dropdowns open at rest, horizontal overflow, and
  # duplicated <style> blocks. Advisory on introduction, same as the two jobs
  # below; PROMOTED 2026-08-26 — green on every completed main run since
  # introduction (2026-08-18), including the full post-cancellation window
  # the four ledgered jobs were recounted over. Promotion evidence in
  # documentation/projects/WEEKLY_CADENCE.md.
  qc-render-sweep:
    name: Rendered QC sweep (docs/)
    runs-on: ubuntu-latest
    # Matches the two other Playwright jobs below. This job was added AFTER
    # 42e4a003 gave every job a timeout, so it inherited GitHub's 6-hour
    # default and was the only job in this file without one. Found the hard
    # way on 2026-08-19: a Playwright CDN stall cancelled four sibling jobs at
    # their 20m timeouts while this one sat on the same dead download for 50+
    # minutes and would have held a runner for six hours. The sweep itself
    # renders 218 pages in ~2 min, so 20m is ~10x headroom — it exists to fail
    # fast on a hung download, not to bound normal work.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # NO bare `playwright` argument here — install the workspace AS PINNED,
      # the same two lines visual-regression and visual-brand-tokens use (and
      # which pass). `npm install … playwright` adds playwright@latest ON TOP of
      # the pinned @playwright/test@^1.61.1, and BOTH packages ship a bin named
      # `playwright`. Whichever npm links last owns .bin/playwright, so
      # `npx playwright install` fetched browsers for one version while
      # scripts/qc-render-sweep.js (testRequire('playwright')) resolved the
      # other — the job died at browserType.launch with "Executable doesn't
      # exist at …/chromium_headless_shell-<rev>" and never rendered a page.
      # It had failed that way on every run since it shipped, so this gate has
      # never actually run. @playwright/test depends on playwright at the same
      # version, so the pinned install gives require('playwright') the exact
      # version whose browsers were just downloaded.
      - name: Install Playwright (tests workspace)
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve docs/
        run: |
          # Warm the npx cache BEFORE the wait window opens. Both tools were
          # `npx --yes` cold downloads, so http-server was still being fetched
          # while wait-on's 60s clock ran — the step spent ~3m50s installing,
          # then timed out 60s later having never seen the server bind
          # (PR #1373, run 33813431908, on a commit that touched no docs/ file).
          npx --yes http-server --version >/dev/null
          npx --yes wait-on --version >/dev/null
          npx --yes http-server docs -p 5000 -c-1 --silent &
          npx --yes wait-on http://localhost:5000/ --timeout 120000
      - name: Sweep
        run: node scripts/qc-render-sweep.js --base http://localhost:5000 --json qc-render-sweep.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qc-render-sweep-report
          path: qc-render-sweep.json
          retention-days: 7

  # Brand-token computed-style assertions (2026-08-07 audit): the isolated
  # tests/visual workspace (own package.json + playwright.config serving
  # docs/ over http-server) was referenced by no workflow. These are token/
  # computed-style checks, not pixel screenshots — no goldens involved.
  # Advisory on introduction; PROMOTED 2026-08-26 on a 10/10 green streak
  # (ledger in documentation/projects/WEEKLY_CADENCE.md).
  visual-brand-tokens:
    name: Brand-token visual assertions
    runs-on: ubuntu-latest
    # 20, same tier as the other Playwright jobs. First cut of this file
    # put it at 15 on the belief it had no Playwright install — wrong: it
    # installs via `npm run install:browsers` (tests/visual), which a
    # grep for "playwright install" does not match. It then timed out on
    # exactly that step at 15m14s. Match on the STEP NAME, not the
    # command, when auditing this.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install visual workspace deps
        run: |
          cd tests/visual
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests/visual
          npm run install:browsers
      - name: Run brand-token assertions
        run: |
          cd tests/visual
          npm test

  # Pixel-diff visual regression over the public /pro pages (2026-08-07
  # audit): the spec + npm scripts existed, appeared in zero workflows, and
  # NO baselines were ever generated. Baselines must be CI-RENDERED —
  # container-local font rasterization does not match ubuntu runners even at
  # the generous thresholds. The job self-selects its mode:
  #   • no committed snapshots dir → generates baselines + uploads them as
  #     an artifact; a human downloads, reviews, and commits them under
  #     tests/e2e/visual-regression.spec.js-snapshots/ (the bless step).
  #   • snapshots dir committed → compares and reports drift.
  # PROMOTED 2026-08-26 on a 10/10 green run (ledger in
  # documentation/projects/WEEKLY_CADENCE.md) — but the baselines had NOT
  # been blessed at that point: the snapshots dir was never committed, so
  # every one of those "green" runs took the --update-snapshots branch and
  # asserted nothing. Blessed 2026-09-02 from run 33652262168's artifact
  # (12 PNGs: login/register/pricing/landing × mobile-375/tablet-768/
  # desktop-1280, chromium-linux). tests/smoke/dashboard.test.js pins the
  # directory so the job can't silently fall back to generate mode again;
  # to re-bless on purpose, delete the directory in the same PR that
  # changes the pages and commit the artifact from that PR's run.
  visual-regression:
    name: Visual regression (public pro pages)
    runs-on: ubuntu-latest
    # 20: installs Playwright (same wedge exposure as public-e2e); now
    # that the job is required, the cap is what makes a hung install a
    # fast red instead of a blocked merge.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - name: Run visual regression (compare, or generate baselines on first run)
        run: |
          cd tests
          if [ -d e2e/visual-regression.spec.js-snapshots ]; then
            MODE=""
            echo "baselines committed — compare mode"
          else
            MODE="--update-snapshots"
            echo "no baselines — generating for review/bless"
          fi
          npx firebase-tools emulators:exec --only hosting --project nobigdeal-pro \
            "PLAYWRIGHT_BASE_URL=http://127.0.0.1:5000 playwright test --config=playwright.config.js --workers=1 visual-regression.spec.js $MODE"
      - name: Upload baselines / diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-output
          path: |
            tests/e2e/visual-regression.spec.js-snapshots/
            tests/test-results/
          retention-days: 14
