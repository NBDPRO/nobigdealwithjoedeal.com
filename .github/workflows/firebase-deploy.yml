name: Firebase deploy

# Auto-deploys the site to Firebase on every push to main.
#
# Gracefully skips when the FIREBASE_SERVICE_ACCOUNT secret is not
# configured — that way this file can live in main from day one
# without generating failure emails before go-live.
#
# Deploy order (when the secret IS set):
#   1. Hosting (FIRST — so a rules/functions auth-flake never starves content)
#   2. Firestore rules + indexes (pro project)
#   3. Storage rules
#   4. Cloud Functions
#
# ─────────────────────────────────────────────────────────────
# REQUIRED GITHUB ACTIONS SECRET (one-time setup to enable deploys)
# ─────────────────────────────────────────────────────────────
# Name:  FIREBASE_SERVICE_ACCOUNT
# Value: the contents of a Firebase service-account JSON file with
#        Cloud Functions Deployer + Cloud Datastore User + Firebase
#        Hosting Admin + Firebase Rules Admin roles.
#
# How to generate:
#   1. Firebase Console → Project Settings → Service accounts →
#      "Generate new private key" → download JSON
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret → name: FIREBASE_SERVICE_ACCOUNT,
#      value: paste the entire JSON file contents
#   3. NEVER commit the JSON to the repo. GitHub Secrets are the
#      only place it should live.
#
# Until the secret is set, every workflow run will be a quick
# "skipped — secret not configured" notice, NOT a failure email.
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      # Skip doc-only changes
      - 'docs/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hosting
          - functions
          - rules

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────
  # check — read whether the secret is set. Always succeeds.
  # Outputs `configured=true|false` for the deploy job's `if:`.
  # This runs without accessing the secret's value, only its presence,
  # so it's cheap and GitHub-Actions-safe.
  # ─────────────────────────────────────────────────────────
  check:
    name: Check if Firebase credentials are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is set — proceeding to deploy."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏸ Firebase deploy skipped"
              echo ""
              echo "The \`FIREBASE_SERVICE_ACCOUNT\` repository secret is not configured yet."
              echo "Auto-deploy is intentionally disabled until it's set — this is a safety feature, not an error."
              echo ""
              echo "**To enable auto-deploy:**"
              echo ""
              echo "1. Firebase Console → Project Settings → Service Accounts → *Generate new private key* → download the JSON."
              echo "2. GitHub repo → Settings → Secrets and variables → Actions → **New repository secret**"
              echo "   - Name: \`FIREBASE_SERVICE_ACCOUNT\`"
              echo "   - Value: paste the entire JSON file contents"
              echo "3. Push to main (or manually re-run this workflow from the Actions tab)."
              echo ""
              echo "Until then every push will show this notice instead of failing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set — skipping deploy (this is expected before go-live)."
          fi

  # ─────────────────────────────────────────────────────────
  # deploy — runs only when credentials are present. Never runs on
  # an un-configured repo, so no more failure emails pre-go-live.
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Firebase
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Bumped 15 -> 30: the real (strict) functions deploy alone can run
    # ~10-13 min; with the tolerant retry now bounded below, this leaves
    # comfortable headroom so Hosting always reaches its step.
    # Bumped 30 -> 40 (2026-07-23): the CPU-quota straggler-retry rounds in the
    # strict functions step add up to ~3 paused re-deploys of the failed subset.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PRO_PROJECT: nobigdeal-pro
      NODE_VERSION: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The blog index ships its post cards as static HTML between
      # BLOG-STATIC markers (SEO/AEO: JS-injected cards are invisible to
      # crawlers). Regenerate at deploy time so future-dated posts in the
      # POSTS array flip from JS-only countdown to static card the first
      # deploy after their publish date — no manual step. The committed
      # HTML already carries the current output; this only refreshes it.
      # Soft-fail on purpose: the committed HTML already carries the current
      # generated block, so if the POSTS file is ever re-hashed/renamed or the
      # markers move, deploying the committed (possibly stale) block beats
      # aborting the whole deploy job (hosting + rules + functions) over a
      # blog-card refresh. The ::warning keeps the failure visible in the run.
      - name: Regenerate static blog index
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-blog-index.mjs docs/assets/js/inline/c00f1acac9.js docs/blog/index.html \
            || echo "::warning::static blog index regeneration failed — deploying the committed static block as-is"

      # Same shape for the Featured Projects gallery (docs/our-work.html is
      # generated from assets/data/projects.json). Restamping here is what
      # flips a future-dated project live on the first deploy after its date.
      - name: Regenerate static projects gallery
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-projects.mjs \
            || echo "::warning::static projects regeneration failed — deploying the committed static block as-is"

      # Same soft-fail rationale. --write only syncs the URL SET (new/removed
      # pages); existing lastmods are preserved by design and the git-date
      # mode is local-only (CI checkout is shallow, git dates would be wrong).
      - name: Sync sitemap URL set
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-sitemap.js --write \
            || echo "::warning::sitemap regeneration failed — deploying the committed sitemap as-is"

      # Same soft-fail shape for the RSS feed. Reads the same POSTS array as
      # the blog index above, so this is what flips a future-dated post into
      # the feed on its first post-date deploy.
      - name: Regenerate RSS feed
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-feed.mjs --write \
            || echo "::warning::feed regeneration failed — deploying the committed feed as-is"

      # Same soft-fail shape for llms.txt's generated lists and llms-full.txt.
      # Runs AFTER the projects + sitemap regen above because it reads both:
      # this is what flips a future-dated project into llms.txt's case studies.
      # It MUST stay before "Deploy Hosting": that step uploads this job's
      # working-tree docs/ (firebase.json hosting.public), so the llms-full.txt
      # written here — rebuilt from the exact pages being deployed — is the one
      # that ships. CI gates only the llms.txt regions; the committed
      # llms-full.txt is a seed that may lag (tests/build-llms-modes.test.js).
      - name: Regenerate llms.txt lists + llms-full.txt
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-llms.mjs --write \
            || echo "::warning::llms regeneration failed — deploying the committed llms files as-is"

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      # Writes the service account JSON via an env var instead of shell
      # interpolation, which avoids GitHub Actions' "possible secret
      # exposure" warnings and is the recommended pattern.
      - name: Write service-account JSON to a temp file
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SA_JSON" > "$SA_FILE"
          if [ ! -s "$SA_FILE" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT resolved to empty at deploy time."
            exit 1
          fi
          echo "sa_path=$SA_FILE" >> "$GITHUB_OUTPUT"

      # ── Gate — the frontend must be provably non-broken before it ships ──
      #
      # This workflow does NOT depend on the CI workflow; both trigger on the
      # same push to main and run in parallel. So until this gate existed, the
      # rules deploy was gated (below), the functions deploy was gated (below),
      # and Hosting — the surface every user actually touches — shipped with
      # nothing in front of it. A push that broke every test still put the
      # whole frontend into production.
      #
      # Both checks below are deliberately chosen to be FAST and FLAKE-PROOF,
      # because the hosting-first ordering exists to protect content delivery
      # from *deploy-step* flakes (the #732/#736 auth races) and a gate that
      # can itself flake would give that guarantee back:
      #   - No network, no emulator, no browser, no credentials.
      #   - No npm install (both are Node-builtins only).
      #   - Measured locally over the full tree: ~4s (459 files) and ~0.5s
      #     (211 pages / 20k refs). Negligible against a ~10-13 min deploy.
      # Anything slower or network-dependent belongs in ci.yml, not here.
      #
      # A failure here is real: a shipped .js that parses under neither
      # grammar, or a dead internal link / 404'd asset / broken anchor.
      #
      # --shipped-only (2026-09-25): check-js-syntax.js now also parses tests/
      # by default, for ci.yml. A spec that fails to parse must turn CI red,
      # but it ships nothing, so it must not hold back this deploy — the flag
      # keeps this gate on functions/ + docs/, exactly the scope it had.
      #
      # Placement is deliberate: this runs AFTER the blog-index and sitemap
      # regeneration steps above, which rewrite docs/ at deploy time. So the
      # integrity check validates the content that ACTUALLY ships, including
      # the freshly generated blog cards — which the ci.yml copy of this check
      # (running against the committed tree) structurally cannot do. Those two
      # generators soft-fail by design; this is what catches it when a
      # soft-failed or malformed regeneration would have shipped a broken page.
      - name: Gate — shipped JS must parse + site integrity must hold
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          set -e
          node scripts/check-js-syntax.js --shipped-only
          node scripts/check-site-integrity.js --quiet
          # Shared-partial drift, checked against the tree that actually ships.
          # --check writes nothing: if a region were restamped here the deploy
          # would silently publish content that is not in the repo. Failing
          # instead keeps docs/ the single source of truth for what is live.
          node scripts/apply-partials.js --check

      # Stamp the Sentry release tag with the deploy SHA so every deploy
      # groups its errors under a fresh release in Sentry instead of a
      # 6-month-old bug's bucket. Replaces the placeholder line in
      # docs/pro/js/sentry-config.js. Runner-local — NOT committed back to
      # the repo: the source tree keeps the generic placeholder so feature
      # branches don't pick up noisy release-stamp diffs on every push.
      # tests/smoke/dashboard.test.js's `window.__NBD_RELEASE` pin only
      # requires the value start with 'web@', so this rewrite doesn't
      # need a matching test-pin update.
      - name: Stamp Sentry release with git SHA
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA::8}"
          DATE=$(date -u +%Y-%m-%d)
          NEW_TAG="web@${DATE}-${SHORT_SHA}"
          if [ -f docs/pro/js/sentry-config.js ]; then
            sed -i "s|window\.__NBD_RELEASE = 'web@[^']*';|window.__NBD_RELEASE = '${NEW_TAG}';|" docs/pro/js/sentry-config.js
            echo "::notice::Sentry release stamped → ${NEW_TAG}"
          else
            echo "::warning::sentry-config.js not found — skipping release stamp"
          fi

      # Hosting deploys FIRST — before rules / indexes / storage / functions —
      # so a transient auth-race flake on the rules deploy (the recurring
      # "Failed to authenticate" abort that took out deploys #732 + #736) can
      # never starve the user-facing hosting deploy. Hosting (static content)
      # has no dependency on rules or functions. The rules + functions steps
      # still run after this and still fail the job on a real error (functions
      # stay gated behind the rules deploy), so regressions are surfaced — they
      # just no longer block the frontend from shipping.
      #
      # NOTE: "first" is about DEPLOY ordering, not about skipping validation —
      # the static pre-flight gate above still runs ahead of this step.
      - name: Deploy Hosting
        id: hosting
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          # GitHub runs `run:` blocks with `bash -e` (errexit), which would abort
          # the script the moment the captured `firebase deploy` command exits
          # non-zero — BEFORE the benign-string check below runs. Disable errexit
          # so we handle exit codes explicitly. (#781 added the check but missed
          # this, so the step still false-RED'd on the first attempt.)
          set +e
          for attempt in 1 2 3; do
            out=$(npx firebase-tools deploy --only hosting --project "$PRO_PROJECT" --non-interactive 2>&1)
            rc=$?
            echo "$out"
            if [ $rc -eq 0 ]; then
              echo "✓ Hosting deployed (attempt $attempt)."
              exit 0
            fi
            # Benign concurrent-deploy race: the parallel dev worktrees push main
            # together, so two deploy jobs run at once. The upload + finalize
            # succeed in both; the loser's RELEASE call returns HTTP 400
            # "supplied version ... is the current active version" because the
            # other job already released this exact content. Hosting IS up to
            # date — treat as success, not a flake. (Real hosting failures don't
            # carry this string and still retry/fail below.) This stops every
            # deploy from going false-RED, which was masking genuine failures.
            if echo "$out" | grep -q "is the current active version"; then
              echo "✓ Hosting already at the current version (a concurrent deploy released it) — treating as success."
              exit 0
            fi
            echo "::warning::Hosting deploy attempt $attempt failed — retrying in 15s…"
            sleep 15
          done
          echo "::error::Hosting deploy failed after 3 attempts."
          exit 1

      # IndexNow: announce the public pages this push changed (Bing's index
      # feeds ChatGPT search). PRODUCTION ONLY — a push to main whose Hosting
      # deploy just succeeded; never workflow_dispatch, never a PR or preview.
      # The script diffs github.event.before..sha under docs/, maps files to
      # canonical URLs, keeps only sitemap-listed non-noindex public pages
      # (never /pro, /admin, /sites) plus llms.txt / llms-full.txt /
      # sitemap.xml, and POSTs them. An all-zero before-SHA (new branch /
      # force push) or an unfetchable before-commit is a clean skip.
      # continue-on-error + a 2-minute cap: a ping failure must never fail or
      # stall a deploy. It runs only `git` and `fetch` — no firebase tooling.
      - name: Ping IndexNow with changed public pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.hosting.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/indexnow-ping.mjs --before "$BEFORE_SHA" --after "$AFTER_SHA"

      # ─────────────────────────────────────────────────────────
      # Enable APIs that firebase-tools doesn't auto-enable. 2nd-gen
      # onSchedule functions need cloudscheduler.googleapis.com (the
      # CLI enables pubsub + eventarc automatically, but Scheduler is
      # on us). beforeUserCreated blocking triggers need Identity
      # Toolkit enabled for the blocking-functions config.
      # Idempotent — already-enabled APIs get a fast no-op.
      # ─────────────────────────────────────────────────────────
      - name: Enable required Google APIs
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set +e
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "$PRO_PROJECT" --quiet
          # APIs firebase-tools doesn't auto-enable:
          #   cloudscheduler        — 2nd-gen onSchedule functions
          #   identitytoolkit       — beforeUserCreated/SignedIn blockers
          #   pubsub + eventarc     — 2nd-gen Storage / Firestore triggers
          #                           (onObjectFinalized, onDocumentWritten,
          #                           etc. fire through Eventarc → Pub/Sub)
          #   run, cloudbuild, artifactregistry — Gen 2 runtime substrate
          # Output CAPTURED, not streamed — printed below only on the paths
          # where it is evidence of something. This call is EXPECTED to fail
          # (see the block immediately below), and gcloud's failure text is a
          # bare, alarming line:
          #   ERROR: (gcloud.services.enable) [firebase-adminsdk-...] does not
          #   have permission to access projects instance [nobigdeal-pro] ...
          # Streaming that on every clean deploy puts a red-looking ERROR two
          # lines above "✓ All 7 required APIs already enabled". The 2026-08-17
          # pass fixed the false ::warning:: annotation but left this line, and
          # on 2026-09-07 it did exactly what the comment below predicts: it was
          # read as a live fault and reported as a production issue by someone
          # triaging a genuinely failed deploy in the same run. The end-state
          # check is the signal; this text is only useful when that check finds
          # something wrong, so that is the only place it is shown.
          ENABLE_OUT=$(gcloud services enable \
            cloudscheduler.googleapis.com \
            identitytoolkit.googleapis.com \
            pubsub.googleapis.com \
            eventarc.googleapis.com \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --project "$PRO_PROJECT" --quiet 2>&1)
          EXIT=$?
          # VERIFY THE OUTCOME, NOT THE EXIT CODE (2026-08-17).
          # The deploy SA deliberately does NOT hold
          # roles/serviceusage.serviceUsageAdmin, so `services enable`
          # returns 1 on every run — including when all seven APIs are
          # already enabled, which they are and have been. Warning on the
          # exit code alone printed a scary, actionable-looking annotation
          # ("Manually enable in Cloud Console…") on EVERY deploy for what
          # is a complete no-op, and that false alarm sat in the log long
          # enough to be mistaken for the cause of a real incident.
          #
          # Same lesson as the completion-accounting guard further down:
          # assert the END STATE you actually care about, not whatever the
          # tool volunteers. Here the end state is "are these APIs on?",
          # which is readable with the roles the SA already has.
          ENABLED=$(gcloud services list --enabled --project "$PRO_PROJECT" \
                      --format="value(config.name)" 2>/dev/null)
          if [ -z "$ENABLED" ]; then
            # Couldn't read the list at all — can't distinguish "all fine"
            # from "everything off", so surface it rather than guess.
            echo "::warning::Could not read enabled-API list for $PRO_PROJECT (services enable exited $EXIT). Verify in Cloud Console: cloudscheduler, identitytoolkit, pubsub, eventarc, run, cloudbuild, artifactregistry."
            printf '%s\n' "$ENABLE_OUT" | sed 's/^/    services enable: /'
          else
            MISSING=""
            for api in cloudscheduler identitytoolkit pubsub eventarc run cloudbuild artifactregistry; do
              echo "$ENABLED" | grep -qx "${api}.googleapis.com" || MISSING="$MISSING $api"
            done
            if [ -n "$MISSING" ]; then
              # A REAL problem: an API the deploy depends on is off and the
              # SA can't turn it on. This is the only case worth alarming.
              echo "::warning::Required API(s) NOT enabled on $PRO_PROJECT:$MISSING — the deploy SA lacks roles/serviceusage.serviceUsageAdmin, so enable them in Cloud Console (or grant that role)."
              printf '%s\n' "$ENABLE_OUT" | sed 's/^/    services enable: /'
            else
              echo "✓ All 7 required APIs already enabled (services enable exited $EXIT — expected; the SA can read API state but not change it)."
            fi
          fi
          # Generate the service identity for Pub/Sub. Gen-2 Storage
          # triggers (onAudioUploaded in voice-intelligence.js) fail
          # with "Error generating the service identity for
          # pubsub.googleapis.com" the first time after enabling the
          # API until this identity is explicitly provisioned.
          # Idempotent: succeeds quickly if already exists.
          for api in pubsub eventarc; do
            gcloud beta services identity create --service=${api}.googleapis.com \
              --project "$PRO_PROJECT" --quiet 2>/dev/null
          done
          echo "✓ Required APIs + service identities provisioned (or already on)."
          exit 0

      # ─────────────────────────────────────────────────────────
      # Ensure every integration secret my code defineSecret()'s
      # exists in Secret Manager. Any that are missing get created
      # with an empty value — the lazy-opt-in pattern in the runtime
      # code treats an empty string as "this integration isn't
      # configured, skip it" (see integrations/_shared.js hasSecret).
      #
      # Existing secrets (Stripe / Twilio / Resend / etc.) are LEFT
      # ALONE — we only create what's missing, never overwrite.
      #
      # Without this step the deploy fails the first time any new
      # `defineSecret('FOO')` is introduced, because firebase-tools
      # in non-interactive mode requires the secret resource to
      # already exist.
      # ─────────────────────────────────────────────────────────
      - name: Ensure integration secrets exist (stub if missing)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set -e
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "$PRO_PROJECT" --quiet
          # Auto-discover every name referenced by a defineSecret(...)
          # call in functions/. This catches both new integration
          # secrets and any pre-existing secrets that happen to be
          # unset in this project (e.g., GOOGLE_GEOCODING_API_KEY
          # was declared in code but never provisioned). Secrets that
          # already exist with real values are untouched — the check
          # below only adds a version when missing.
          ALL_SECRETS=$(grep -rhoE "defineSecret\(\s*['\"][A-Z0-9_]+['\"]" functions/ \
            | sed -E "s/.*defineSecret\(\s*['\"]([A-Z0-9_]+)['\"].*/\1/" \
            | sort -u)
          echo "Discovered secrets: $(echo $ALL_SECRETS | wc -w)"
          echo "$ALL_SECRETS"
          # Firebase CLI needs each secret to have an initial *non-empty*
          # version, otherwise it errors with "has no latest version".
          # Stub with the sentinel value __unset__ which the runtime
          # hasSecret() check in integrations/_shared.js treats as
          # "not configured" and falls through to the lazy-opt-in path.
          STUB='__unset__'
          for SECRET in $ALL_SECRETS; do
            if gcloud secrets describe "$SECRET" --project "$PRO_PROJECT" >/dev/null 2>&1; then
              # Make sure there's at least one version. If the secret
              # exists but was previously created empty (bad stub from
              # an earlier deploy attempt), add the sentinel version
              # now so Firebase CLI is satisfied.
              if ! gcloud secrets versions list "$SECRET" --project "$PRO_PROJECT" --limit=1 --format='value(name)' 2>/dev/null | grep -q .; then
                echo "+ $SECRET exists but has zero versions — adding sentinel"
                printf '%s' "$STUB" | gcloud secrets versions add "$SECRET" --data-file=- --project "$PRO_PROJECT" --quiet
              else
                echo "✓ $SECRET already exists with a version (leaving real value intact)"
              fi
            else
              echo "+ creating stub $SECRET with sentinel value — integration will no-op at runtime until you set a real value"
              printf '%s' "$STUB" | gcloud secrets create "$SECRET" --data-file=- --project "$PRO_PROJECT" --quiet
            fi
          done

      # firebase-tools >= 15 (bumped in #551) dropped support for Java < 21.
      # The Firestore emulator the rules gate below spins up needs a JDK 21+
      # on JAVA_HOME, or `firebase-tools emulators:exec` aborts with
      # "no longer supports Java version before 21". The runner's default
      # JDK (and/or the gcloud steps above) leaves JAVA_HOME < 21, which
      # silently broke EVERY deploy after #551 merged. Pin Temurin 21 here.
      - name: Set up JDK 21 (firebase-tools 15 emulator requirement)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      # AUDIT #2 (Phase 8.4): gate the rules deploy on the rules tests.
      # A regression that reopens a cross-tenant hole or flips an
      # allow/deny must NOT ship. Runs the same emulator suite as CI;
      # a non-zero exit stops the job HERE — before any rules (or the
      # functions/hosting steps below) deploy. Same `if:` condition as
      # the rules-deploy step so it only runs when we're deploying rules.
      # 2026-09-02: the Storage suite joined the gate. storage.rules deploys
      # from this same job ("Deploy Storage rules" below) but its tests ran
      # only in ci.yml, which this workflow does not wait for — a bad
      # storage.rules could ship. Same emulator suite as ci.yml's
      # firestore-rules job.
      - name: Gate — Firestore + Storage rules tests must pass before deploy
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        run: |
          set -e
          cd tests
          npm ci --silent || npm install --silent --no-audit --no-fund
          npx firebase-tools emulators:exec --only firestore --project nbd-rules-test 'node firestore-rules.test.js'
          npx firebase-tools emulators:exec --only firestore --project nbd-xtenant-test 'node firestore-rules.cross-tenant.test.js'
          npx firebase-tools emulators:exec --only firestore --project nbd-commlog-test 'node communication-log-contract.test.js'
          npx firebase-tools emulators:exec --only storage --project nbd-storage-test 'node storage-rules.test.js'

      # Rules deploy is idempotent. The CLI intermittently fails the FIRST
      # attempt with a transient auth race ("Failed to authenticate, have you
      # run firebase login?") that clears on a re-run — and because this step
      # runs BEFORE hosting with no continue-on-error, that flake used to abort
      # the entire deploy (content didn't go live until a manual re-run). Retry
      # in-job up to 3x so the transient auth race self-heals instead of going
      # RED. A genuine failure still fails the workflow after the retries.
      - name: Deploy Firestore rules (pro)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set -e
          for attempt in 1 2 3; do
            if npx firebase-tools deploy --only firestore:rules --project "$PRO_PROJECT" --non-interactive; then
              echo "✓ Firestore rules deployed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Firestore rules deploy attempt $attempt failed (likely transient auth race) — retrying in 15s…"
            sleep 15
          done
          echo "::error::Firestore rules deploy failed after 3 attempts."
          exit 1

      # Firestore composite indexes ship before functions so every
      # new .where() query has its index ready when the function
      # execution first hits it.
      #
      # Known firebase-tools quirk: the CLI returns non-zero on any
      # HTTP 409 ("index already exists") — even when the partial
      # set of indexes it CAN create succeeds. Sometimes an index
      # exists from a prior console edit or manual deploy and
      # blocks every subsequent run. We tolerate non-zero here so
      # rules / functions / hosting still roll out; the raw CLI
      # output in the log tells us exactly which index conflicted.
      # F-10: index deploy now distinguishes 409 "already exists" (a
      # benign no-op) from every other failure. Previously `set +e`
      # swallowed ALL errors, which would mask a real problem like a
      # malformed composite index spec or a permissions regression.
      - name: Deploy Firestore indexes (pro)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/firestore-indexes.log"
          npx firebase-tools deploy --only firestore:indexes --project "$PRO_PROJECT" --non-interactive 2>&1 | tee "$LOG"
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -eq 0 ]; then
            echo "✓ Firestore indexes deployed cleanly."
            exit 0
          fi
          # Positive 409 filter — accept ONLY if every non-OK line was
          # an "already exists" conflict. Anything else is a real error.
          if grep -qiE 'error|failed|denied|permission' "$LOG" \
             && ! grep -qiE 'already exists|409' "$LOG"; then
            echo "::error::Firestore index deploy failed with a non-409 error (exit $EXIT). Fix it before merging."
            exit $EXIT
          fi
          # Mixed 409 + other lines: if any non-409 error is present,
          # fail. If only 409s, tolerate.
          if grep -qiE 'error|failed|denied|permission' "$LOG" \
             && grep -vE 'already exists|409' "$LOG" | grep -qiE 'error|failed|denied|permission'; then
            echo "::error::Firestore index deploy had a non-409 error mixed with 409s. Fix and re-run."
            exit $EXIT
          fi
          echo "::warning::Index deploy hit 'already exists' (409) only. Treating as no-op."
          exit 0

      # F-10: Storage rules deploy MUST fail the workflow if it fails.
      # Previously we swallowed the exit code and shipped functions +
      # hosting against a stale rules set — which is exactly the kind
      # of silent regression a security audit flags. If IAM is missing
      # for the deploy SA, fix IAM once, not every push.
      - name: Deploy Storage rules (pro)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set -e
          for attempt in 1 2 3; do
            if npx firebase-tools deploy --only storage --project "$PRO_PROJECT" --non-interactive; then
              echo "✓ Storage rules deployed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Storage rules deploy attempt $attempt failed (likely transient auth race) — retrying in 15s…"
            sleep 15
          done
          echo "::error::Storage rules deploy failed after 3 attempts."
          exit 1

      # F-10 + Q8: functions deploy is strict by default — any failure
      # fails the workflow. But there's an explicit exception list
      # (NBD_DEPLOY_SKIP_LIST) for functions that cannot deploy.
      #
      # TODAY THE LIST HAS EXACTLY ONE ENTRY: onRepSignup, a
      # beforeUserCreated blocking trigger, blocked on GCIP (below).
      # NOTHING SCHEDULED IS ON IT, and nothing scheduled has failed
      # since 2026-04-14. See "the scheduled half is long fixed" below
      # before adding anything here.
      #
      # CORRECTION 2026-08-17 (verified against prod audit logs — the
      # "identityplatform.admin" story below was WRONG for three years
      # of comments and is kept only to explain the skip-list's shape):
      # blocking-trigger registration does NOT fail on IAM. Every deploy
      # emits an identitytoolkit UpdateConfig call that fails with
      #
      #   OPERATION_NOT_ALLOWED : Blocking Functions may only be
      #   configured for GCIP projects.
      #
      # 162 consecutive failures in the last 30 days, principal
      # firebase-adminsdk-fbsvc@nobigdeal-pro. `nobigdeal-pro` is
      # subtype FIREBASE_AUTH — it has never been upgraded to Google
      # Cloud Identity Platform, and blocking functions are a GCIP-only
      # feature. Granting roles/identityplatform.admin CANNOT fix this;
      # the project has to be upgraded to Identity Platform first
      # (a paid-tier product decision, Jo's call — not an ops IAM tweak).
      # CONFIRMED 2026-08-17: the deploy SA ALREADY HOLDS
      # roles/identityplatform.admin (and roles/cloudscheduler.admin).
      # Both were granted 2026-04-14 at 22:02 UTC (project SetIamPolicy
      # audit log) — the role is present and registration still fails,
      # which settles it. Check the IAM policy before ever granting an
      # auth role here; the answer is "already there".
      # Consequence: the project's Identity Platform blockingFunctions
      # config is `{}`, so onRepSignup has NEVER been invoked (zero
      # Cloud Run requests in 30d) and claim-minting runs through the
      # callable fallbacks (claimInvite / activateInvitedRep /
      # mintOwnerClaims) instead. Full writeup:
      # documentation/audit/BLOCKING-TRIGGERS-NOT-GCIP-2026-08-17.md
      #
      # ── the scheduled half is long fixed (diagnosed 2026-08-17) ──
      # This block used to describe a Cloud Scheduler IAM gap and list
      # "8 functions". That gap closed 2026-04-14T22:02 — HOURS after
      # the skip list was first written — when roles/cloudscheduler.admin
      # was granted. What happened next is why the story outlived it:
      #   - 2026-04-15: recordingRetentionCron was ADDED to the list
      #     blaming the "same SA gap", which had been fixed the day
      #     before. Whatever actually broke it is unrecoverable now
      #     (logs are past retention); it was NOT this.
      #   - 2026-05-16: the list was emptied and onRepSignup re-added
      #     alone, via two GitHub web-editor commits. The scheduled
      #     names were correctly dropped — the prose around them was
      #     never touched.
      # Verified 2026-08-17: all 24 onSchedule exports are ACTIVE and
      # update on every deploy, all 24 Cloud Scheduler jobs are ENABLED,
      # and there are zero cloudscheduler API errors in 30 days.
      # If a scheduled function ever DOES fail here, diagnose it fresh.
      # It is not IAM, and it has no precedent since 2026-04-14.
      #
      # Strategy:
      #  1. Main deploy = everything EXCEPT the known-blocked names.
      #     Strict — failure fails the workflow.
      #  2. Second step (tolerant) retries ONLY those — in practice just
      #     onRepSignup. Errors there produce a warning, not a failure.
      #     It stays stuck until GCIP; no IAM grant changes that.
      #
      # Full remediation runbook: see POST_DEPLOY_CHECKLIST §16.
      #
      # --force auto-confirms destructive prompts. It does NOT delete orphan
      # functions here, and the older wording claiming it did was wrong in a
      # way that cost real cleanup — corrected 2026-09-04.
      #
      # Firebase only DETECTS an orphan (deployed function with no matching
      # export) on an UNFILTERED `deploy --only functions`. Every deploy in
      # this workflow names its targets explicitly — `--only functions:NAME`,
      # see _deploy_only() below and the comment above it that says so — so
      # anything absent from the list is simply not considered. --force then
      # has no deletion to confirm.
      #
      # Measured 2026-09-04: eight functions retired from source on 2026-08-06
      # and 2026-08-11 (sendEstimateEmail, sendTeamInviteEmail, sendDripEmail,
      # auditCustomerDataIntegrity, backfillCustomerData, migratePinsToKnocks,
      # triggerProcessRecording, reprocessRecording) were still deployed and
      # serving frozen code months later, across many green deploys. One of
      # them even carried a source comment asserting its "Prod instance
      # deleted via console". It had not been. All eight were deleted by hand;
      # the fleet went 179 -> 171.
      #
      # So: RETIRING AN EXPORT DOES NOT UNDEPLOY IT. Deleting the code is half
      # the job — `gcloud functions delete <name> --region=us-central1` is the
      # other half, and nothing in CI will do it or notice it was skipped.
      #
      # --debug was retained on 2026-04-14 to diagnose the IAM-denial cascade;
      # removed now that the split-deploy strategy works cleanly. If
      # a future deploy goes opaque again, add --debug back as the
      # first investigation step.
      # AUDIT #4 (6.1): gate the functions deploy on the smoke suite, mirroring
      # ci.yml's smoke-tests job. functions/ deps are already installed above
      # (Install Cloud Functions dependencies), so the photo-vision sanitizer
      # test's require() resolves. A red suite blocks the deploy instead of
      # shipping a regression the suite would have caught.
      - name: Gate — function smoke suite must pass before deploy
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        run: node tests/smoke.test.js

      - name: Deploy Cloud Functions (strict — retries CPU-quota stragglers)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
          # Functions that cannot deploy. NOT an IAM list — both roles
          # this used to blame (cloudscheduler.admin,
          # identityplatform.admin) have been granted since
          # 2026-04-14T22:02. onRepSignup is here because blocking
          # triggers need GCIP and this project is FIREBASE_AUTH.
          # Empty it only when the project is upgraded to Identity
          # Platform. Do not add scheduled functions — see the block
          # above the strict step.
          NBD_DEPLOY_SKIP_LIST: "onRepSignup"
          # Batched-retry knobs for the Cloud Run CPU-quota mitigation below.
          NBD_DEPLOY_RETRY_ROUNDS: "3"   # extra passes over just the stragglers
          NBD_DEPLOY_RETRY_PAUSE: "45"   # let wave-1 revisions settle + old ones tear down (frees CPU)
          NBD_DEPLOY_BATCH_SIZE: "20"    # cap concurrent new revisions per retry chunk
          NBD_DEPLOY_BATCH_PAUSE: "20"
          # Wave-1 burst cap (0 = single bulk pass; 60 = chunk the --only list).
          #
          # There is NO firebase-tools knob for this — checked against the v15
          # source: `src/deploy/functions/release/index.ts` hardcodes the
          # deploy queue at `concurrency: 40` with no env override and no CLI
          # flag (`firebase deploy` takes only --public/--message/--only/
          # --except/--dry-run/--force). The only lever we control is how many
          # functions a single invocation is asked to mutate, so the "cap" has
          # to be our own chunking of the --only list — which is also exactly
          # what firebase-tools' own 429 handler recommends ("please deploy
          # your functions in batches by using the --only flag").
          #
          # SET TO 60 on 2026-08-17 (was 0). It was left off while the
          # mutation-rate 429 mode had been seen once; it then recurred on the
          # next two deploys carrying this step:
          #   32074172766  ~17 functions silently dropped
          #   32080455395   28 functions silently dropped (139/167 completed,
          #                 ZERO "Failed to ..." lines, firebase-tools exit 0)
          # Two occurrences one deploy apart is a pattern, and every occurrence
          # is a window where prod runs stale code until the retries heal it.
          # ~168 functions -> chunks of 60, 60, 48.
          #
          # SECOND, DISTINCT MODE this also mitigates (added 2026-08-17): the
          # CPU-quota healthcheck failures. Run 32083185787 lost 75 of ~168 in
          # wave 1 — LOUD failures ("Failed to update function X"), not silent
          # drops, retried 75 -> 3 -> 0. Cause confirmed from the GCP audit log
          # rather than inferred, which the "likely CPU-quota" comments elsewhere
          # in this file never were:
          #   "Could not create or update Cloud Run service <name>, Container
          #    Healthcheck failed. Quota exceeded for total allowable CPU per
          #    project per region."
          # That is run.googleapis.com/cpu_allocation. Read via the Service
          # Usage API 2026-08-17: us-central1 sits at the flat default 200000
          # (1/min/{project}/{region}) with NO override — identical to every
          # other region, so nothing here has ever been tuned. Chunking helps
          # both modes because both are burst-driven.
          #
          # MEASURED on the first chunked run (32085658469): 167 functions,
          # ZERO stragglers of any kind, zero retry rounds, strict step 11m26s
          # vs 15m36s / 13m44s / 16m07s for the three unchunked runs before it.
          # Chunking is ~4-5 min FASTER, not the ~2-3 min slower first estimated
          # here — that estimate priced the chunking and ignored the price of
          # NOT chunking: RETRY_PAUSE is 45s, batch pauses 20s, and every retry
          # round re-invokes the CLI anyway. Not tripping the quota is cheaper
          # than recovering from it. Don't "optimize" this back to 0 on the
          # assumption that one bulk pass must be faster; it measurably isn't.
          #
          # Remaining cost, real but so far unrealized:
          #  - 3 firebase invocations instead of 1 TRIPLES the per-deploy
          #    exposure to a wholesale failure (a transient auth flake in any
          #    chunk is fatal by design — see the wholesale guard below). If
          #    deploys start going red on auth rather than on real problems,
          #    that is this tradeoff, and 0 restores the old behavior.
          #
          # Safe with completion accounting (verified by simulation before
          # enabling): _deploy_only reconciles per INVOCATION — `targeted` comes
          # from its own $1, ACCOUNTED_FILE/PARSED_FILE are per-call scratch (>),
          # while MISSING_FILE/FAILED_FILE accumulate (>>). Each chunk audits its
          # own targets, so the mode-3 guard still covers the full set. Chunking
          # does NOT blind the guard.
          #
          # Durable fix is still a quota increase (IAM & Admin -> Quotas ->
          # "Total CPU allocation", a Console request Google reviews), which
          # makes this unnecessary — set back to "0" once it lands.
          NBD_DEPLOY_WAVE1_MAX: "60"
        run: |
          # WHY THIS STEP RETRIES (root cause, diagnosed 2026-07-23):
          # We deploy ~160 Gen2 functions. A single bulk `firebase deploy` rolls
          # out ALL their new Cloud Run revisions at once; during the rollout the
          # old + new revisions both hold CPU (worst for the minInstances
          # functions — render-pdf/stripe/claudeProxy keep warm instances), and
          # the peak blows past the region's "Total allowable CPU per project per
          # region" quota. A RANDOM subset of revisions then fails its Container
          # Healthcheck ("Revision X is not ready and cannot serve traffic") —
          # which is exactly why a different ~5-10% of functions failed to UPDATE
          # on every deploy (runs 2026-07-23 17:26 / 19:06, and 07-23 03:24),
          # never the changed code. Those functions kept their correct prior
          # revision (no outage) but the job went red every time, which masks
          # genuine failures.
          #
          # CORRECTION 2026-09-03 — "never a create" was wrong, and a create is
          # the dangerous case. Adding ONE new function (backupFreshnessCron)
          # produced a run with 110 successful updates and ZERO creates: the
          # new function was in the --only list (verified by re-running the
          # discovery grep against it), firebase printed "Deploy complete!",
          # and the function simply did not exist afterwards. A create needs a
          # brand-new Cloud Run service rather than a revision swap, so it is
          # the MOST likely thing to lose the quota race, not the least. A
          # plain re-run of the same job then created it.
          #
          # WHY THIS MATTERS MORE THAN A RED JOB: an update that loses the race
          # leaves the previous revision serving, so nothing breaks. A create
          # that loses it leaves NOTHING — the function silently does not
          # exist, and neither this workflow's summary nor a green re-run of a
          # later commit will tell you which one was lost.
          # >>> After deploying a NEW function, verify it exists:
          # >>>   gcloud functions describe <NAME> --gen2 --region=us-central1
          # A merged PR is not a deployed function.
          #
          # MITIGATION: keep the fast single bulk pass (wave 1), then re-deploy
          # ONLY the stragglers in small batches after a pause. A handful of new
          # revisions rolls out under quota once wave 1 has settled. If functions
          # STILL fail after the retries, that's a REAL failure and the job fails
          # (with the residual list) instead of hiding behind the chronic red.
          # DURABLE FIX — DONE 2026-09-03. The Cloud Run "Total allowable CPU
          # per project per region" quota for us-central1 was raised from
          # 200,000 to 600,000 mCPU (200 -> 600 vCPU), auto-approved, verified
          # (us-east1 left at 200,000 as a control).
          #
          # CORRECTION 2026-09-03, same day, by an adversarial re-check. The
          # justification first written here was WRONG and is corrected rather
          # than quietly deleted, because the wrong version is the kind that
          # gets rebuilt on:
          #
          #   IT SAID:  179 services x 1 vCPU = 179 vCPU AT REST = 90% of 200,
          #             a rollout doubles it to ~358, so a complete deploy
          #             "could not fit under any circumstances".
          #   TRUTH:    175 of the 179 services carry no minScale and scale to
          #             ZERO. Only 4 set it, totalling 8 instances. Measured
          #             quiet-window concurrency is 9-14 — about 5-7% of the
          #             old ceiling, not 90%. This quota meters PEAK CONCURRENT
          #             RUNNING-INSTANCE CPU, not provisioned CPU; the real
          #             2026-08-18 quota failure landed exactly when measured
          #             concurrency hit 208 against 200. Nothing supports 358;
          #             the all-time peak here is 208.
          #   AND:      deploy run 33792001186 (18:41-19:12Z) finished 13 min
          #             BEFORE the raise at 19:25Z and SUCCEEDED — 169 updates
          #             plus 1 create, peak 175 instances. Complete deploys
          #             demonstrably did fit under the old ceiling.
          #
          # The honest case for the raise is "~88% of the ceiling at deploy
          # peak, with no margin, and the fleet grows" — which is still a good
          # reason. It is not "impossible". Beware the two "allowable CPU per
          # project per region" strings in the deploy logs: those are this
          # comment being echoed by the runner, not error output, and they read
          # exactly like evidence for the wrong version.
          #
          # The retry/chunking machinery below is KEPT deliberately. It is what
          # made the failures legible in the first place, it still guards the
          # three distinct false-greens documented above, and the quota is a
          # ceiling rather than a guarantee. If deploys go clean for a good
          # while, thin it then — not before.
          #
          # Re-check the live value with:
          #   gcloud beta quotas info describe CpuAllocPerProjectRegion \
          #     --service=run.googleapis.com --project=nobigdeal-pro
          # and note the headroom shrinks by 1 vCPU per function added.
          set +e   # we manage exit codes explicitly by parsing per-pass failures

          # onObjectFinalized added 2026-08-17: the alternation predates the
          # first Storage-trigger export (image-pipeline's onPhotoUploaded,
          # 2026-04-26; voice-intelligence's onAudioUploaded later) — both
          # were silently EXCLUDED from every auto-deploy, so merged changes
          # to them never reached prod until deployed manually. If a new
          # v2 trigger wrapper type is ever introduced (onMessagePublished,
          # onValueWritten, ...), it must be added here or its functions
          # will not deploy.
          ALL=$(grep -rhE "^exports\.[a-zA-Z_][a-zA-Z0-9_]* *= *(onRequest|onCall|beforeUserCreated|beforeUserSignedIn|onSchedule|onObjectFinalized|onDocumentCreated|onDocumentUpdated|onDocumentWritten|onDocumentDeleted|functions\.https\.onRequest|functions\.https\.onCall|functions\.firestore|functions\.auth|functions\.pubsub)" functions/*.js functions/integrations/*.js functions/handlers/*.js functions/migrations/runner.js 2>/dev/null \
                | sed -E 's/^exports\.([a-zA-Z_][a-zA-Z0-9_]*) *=.*/\1/' \
                | sort -u)
          INCLUDE=""
          for fn in $ALL; do
            if echo ",${NBD_DEPLOY_SKIP_LIST}," | grep -q ",${fn},"; then
              echo "⏭  skipping $fn (IAM-blocked; skip-list)"
            else
              INCLUDE="${INCLUDE},functions:${fn}"
            fi
          done
          INCLUDE="${INCLUDE#,}"  # trim leading comma
          if [ -z "$INCLUDE" ]; then
            echo "::error::No functions left to deploy after skip-list"; exit 1
          fi

          FAILED_FILE=$(mktemp)
          WHOLESALE_FILE=$(mktemp)
          MISSING_FILE=$(mktemp)
          ACCOUNTED_FILE=$(mktemp)
          PARSED_FILE=$(mktemp)
          # The discovered names, as a file, so the failure parse can be checked
          # against reality before anything it produced reaches a `--only`.
          ALL_FILE=$(mktemp)
          printf '%s\n' "$ALL" > "$ALL_FILE"

          # firebase-tools colorizes its output whenever CI is set in the
          # environment (colorette enables color on "CI" in env — TTY or not),
          # so every line parsed below arrives wrapped in ANSI escapes. Strip
          # them first: an unstripped parse matches nothing, which would make
          # every function look unaccounted-for and trigger a retry storm.
          ESC=$(printf '\033')
          _strip_ansi() { sed -E "s/${ESC}\[[0-9;]*[a-zA-Z]//g"; }

          # _deploy_only <comma-separated functions:NAME list> — runs the deploy,
          # echoes firebase output to the log, and appends any function that did
          # not demonstrably deploy to FAILED_FILE. Three independent signals,
          # because this pipeline has now produced three distinct false-greens:
          #
          #  1. PER-FUNCTION PARSE. firebase prints "Failed to (create|update)
          #     function NAME in region ..." per failure.
          #  2. WHOLESALE-FAILURE GUARD (2026-08-10 audit): a deploy that died
          #     BEFORE per-function rollout (auth error, config parse, quota
          #     abort — exit != 0 with zero "Failed to ..." lines) produced an
          #     empty FAILED set and the step printed "✓ All functions deployed"
          #     while deploying nothing. Nonzero exit with no parsed per-function
          #     failures = wholesale failure, recorded and fatal at the end.
          #  3. COMPLETION ACCOUNTING (run 32074172766, 2026-08-17): an env-var
          #     change made all 167 functions need updates at once, the burst
          #     tripped "Per project mutation requests per minute" (HTTP 429),
          #     and ~17 functions (healthDigestCron among them) got an
          #     "updating..." line but NO completion line — no success, no
          #     "Failed to ...", exit 0. Both guards above passed and the job
          #     went green with stale code live. So: reconcile the set we ASKED
          #     to deploy against the set that actually reported a terminal
          #     result, and treat the difference as stragglers.
          #
          # Why the reconciliation is exact rather than heuristic: firebase-tools
          # skips unchanged functions (planner.ts `toSkipPredicate`) ONLY when
          # `!targetedByOnly` — and we name every function explicitly via
          # `--only functions:NAME`, so nothing is ever skip-eligible here and
          # every target owes us a create/update line. The Skipped line is
          # accepted as terminal anyway, so this stays correct if that filtering
          # behavior (or our --only shape) ever changes.
          _deploy_only() {
            [ -z "$1" ] && return 0
            local out rc clean parsed targeted silent
            out=$(npx firebase-tools deploy --only "$1" --project "$PRO_PROJECT" --non-interactive --force 2>&1)
            rc=$?
            echo "$out"
            clean=$(printf '%s\n' "$out" | _strip_ansi)
            # firebase-tools prints this line in TWO shapes, and the second one
            # broke the retry on 2026-09-06 (run 34067976148, #1445):
            #   Failed to update function onAiDraftApproved
            #   Failed to update function projects/nobigdeal-pro/locations/us-central1/functions/getEstimateForView
            # The qualified form appears when the Cloud Run update returns an
            # HTTP 500 ("Could not update Cloud Run service ... Unable to read
            # due to concurrent lock contention"). The old character class
            # `[A-Za-z_][A-Za-z0-9_]*` stops at the first `/`, so it extracted
            # the literal string **projects** as the function name — and the
            # retry round then ran `--only functions:projects`, which
            # firebase rejects outright with "No function matches the filter:
            # default:projects". One unparseable name took the ENTIRE retry
            # batch down as a wholesale failure, so the four real stragglers
            # were never retried and the deploy went red with prod on stale
            # code for those functions until the next merge healed it.
            # Take the last path segment, which is correct for both shapes.
            parsed=$(printf '%s\n' "$clean" | grep -oE "Failed to (create|update) function [A-Za-z0-9_/-]+" \
                                 | sed -E 's/.*function //; s#.*/##')
            # Mode 1b (run 32925767669, 2026-08-26): when a function's Cloud Run
            # operation poll times out ("Could not get operation details ...
            # Deadline Exceeded."), firebase prints NO "Failed to ..." line for
            # it — the only per-function record is the trailing summary block:
            #   Functions deploy had errors with the following functions:
            #   	onAiDraftApproved(us-central1)
            # Without this parse that shape fell through to the wholesale guard,
            # which declared "nothing or almost nothing was deployed" while
            # 166/167 functions were verifiably live — and the one real
            # straggler never reached the retry rounds, because completion
            # accounting is skipped on the wholesale path. Parse the block's
            # indented NAME(region) lines (it ends at the first non-indented
            # line); on the normal loud-failure deploys the same names already
            # arrive via the "Failed to ..." parse and sort -u dedupes.
            summary=$(printf '%s\n' "$clean" \
              | awk 'flag { if ($0 ~ /^[[:space:]]/) print; else flag=0 } /^Functions deploy had errors with the following functions:/ { flag=1 }' \
              | sed -E 's/^[[:space:]]+//; s/\(.*$//; s/^.*://' | grep -E '^[A-Za-z_][A-Za-z0-9_]*$')
            parsed=$(printf '%s\n%s\n' "$parsed" "$summary" | grep -v '^$' | sort -u)

            # ── the parse must never be able to poison a `--only` ──────────
            # Everything above is a best-effort read of human-facing output
            # that firebase-tools is free to reword. The fix above handles the
            # shape that broke it; the NEXT new shape is the one to survive.
            # A name that is not a function we discovered cannot deploy, and
            # passing it to `--only` does not fail that one target — firebase
            # rejects the whole filter, so a single bad name costs every real
            # straggler in the batch. Drop unknown names loudly instead:
            # degrade to "we may have missed a straggler" (completion
            # accounting below still catches it as silent), never to a retry
            # that cannot run at all.
            local raw_failures bogus
            raw_failures=$(printf '%s\n' "$parsed" | grep -c . || true)
            bogus=$(printf '%s\n' "$parsed" | grep -v '^$' | grep -F -x -v -f "$ALL_FILE" || true)
            if [ -n "$bogus" ]; then
              echo "::warning::Failure parser produced $(printf '%s\n' "$bogus" | grep -c .) name(s) that are not deployable functions — firebase-tools has changed a message shape and the parse needs updating. Ignoring: $(printf '%s\n' "$bogus" | paste -sd, -)"
              parsed=$(printf '%s\n' "$parsed" | grep -v '^$' | grep -F -x -f "$ALL_FILE" || true)
            fi

            [ -n "$parsed" ] && printf '%s\n' "$parsed" >> "$FAILED_FILE"
            # Wholesale means NO per-function failure lines at all. If lines
            # were printed but none survived the validation above, this deploy
            # did roll out per-function — fall through to completion accounting
            # so the real stragglers are still caught, rather than declaring
            # wholesale (which skips accounting and loses them).
            if [ "$rc" -ne 0 ] && [ -z "$parsed" ] && [ "$raw_failures" -eq 0 ]; then
              echo "wholesale deploy failure: exit $rc with no per-function failure lines (targets: $1)" >> "$WHOLESALE_FILE"
              # Deliberately no completion accounting on this path: nothing
              # rolled out, so every target would land in MISSING and we'd burn
              # the retry rounds re-running a deploy that died on auth/config.
              # Wholesale is fatal on its own below.
              return 0
            fi
            # ── completion accounting (mode 3) ──
            # A target is accounted for by a terminal per-function line:
            #   functions[NAME(region)] Successful (create|update) operation.
            #   functions[NAME(region)] Skipped (No changes detected)
            # The label may carry a "codebase:" prefix; the seds below drop the
            # region suffix and any prefix. Explicitly NOT accepted: "Successful
            # delete operation" (orphan cleanup, never a target) — so a delete
            # can't paper over a missing update.
            targeted=$(printf '%s' "$1" | tr ',' '\n' | sed -E 's/^functions://' | grep -v '^$' | sort -u)
            printf '%s\n' "$clean" \
              | grep -oE "functions\[[^]]+\] (Successful (create|update) operation|Skipped \(No changes detected\))" \
              | sed -E 's/^functions\[//; s/\].*$//; s/\([^)]*\)$//; s/^.*://' \
              | grep -v '^$' | sort -u > "$ACCOUNTED_FILE"
            # A function that REPORTED a failure is an ordinary straggler — it is
            # already in FAILED_FILE from the parse above. Subtract those too, so
            # MISSING means only the silent case: targeted, no line of any kind.
            # (Run 32079768048, the first deploy carrying this step, printed 22
            # "Failed to update function" lines in wave 1 and this filter was not
            # here yet — so all 22 were announced as "printed NO completion line",
            # which was flatly untrue. Retry behavior was right; the diagnosis was
            # not, and on a step whose whole purpose is telling failure modes
            # apart, crying wolf on the ~5-10% that fail loudly every deploy would
            # have made the new warning worthless within a week.)
            printf '%s\n' "$parsed" | grep -v '^$' | sort -u > "$PARSED_FILE"
            # grep -F -x -v, not comm: comm compares bytes while sort honours
            # the locale's collation, and these names are mixed-case.
            silent=$(printf '%s\n' "$targeted" \
              | grep -F -x -v -f "$ACCOUNTED_FILE" \
              | grep -F -x -v -f "$PARSED_FILE")
            if [ -n "$silent" ]; then
              printf '%s\n' "$silent" >> "$MISSING_FILE"
              printf '%s\n' "$silent" >> "$FAILED_FILE"
            fi
          }
          # _deploy_batched <newline-separated names> [size] [pause] — deploys in
          # chunks (default NBD_DEPLOY_BATCH_SIZE) so a large straggler set never
          # re-creates the all-at-once CPU spike / mutation-rate burst.
          _deploy_batched() {
            local names="$1" size="${2:-$NBD_DEPLOY_BATCH_SIZE}" pause="${3:-$NBD_DEPLOY_BATCH_PAUSE}"
            local batch="" n=0 fn only
            for fn in $names; do
              batch="$batch $fn"; n=$((n+1))
              if [ "$n" -ge "$size" ]; then
                only=$(echo $batch | tr ' ' '\n' | grep -v '^$' | sed 's/^/functions:/' | paste -sd, -)
                _deploy_only "$only"; batch=""; n=0; sleep "$pause"
              fi
            done
            if [ -n "$(echo $batch | tr -d ' ')" ]; then
              only=$(echo $batch | tr ' ' '\n' | grep -v '^$' | sed 's/^/functions:/' | paste -sd, -)
              _deploy_only "$only"
            fi
          }

          # ── wave 1: the fast single bulk deploy (chunked only if capped) ──
          COUNT=$(echo "$INCLUDE" | awk -F',' '{print NF}')
          if [ "${NBD_DEPLOY_WAVE1_MAX:-0}" -gt 0 ] && [ "$COUNT" -gt "$NBD_DEPLOY_WAVE1_MAX" ]; then
            echo "Deploying $COUNT function(s) in chunks of $NBD_DEPLOY_WAVE1_MAX (mutation-burst cap)"
            _deploy_batched "$(echo "$INCLUDE" | tr ',' '\n' | sed -E 's/^functions://')" \
              "$NBD_DEPLOY_WAVE1_MAX" "$NBD_DEPLOY_BATCH_PAUSE"
          else
            echo "Deploying $COUNT function(s) in one pass"
            _deploy_only "$INCLUDE"
          fi
          FAILED=$(sort -u "$FAILED_FILE")

          # Surface the new mode distinctly BEFORE the retries: a function that
          # silently lost its update is a different (and until now invisible)
          # failure from one that reported an error.
          MISSING_WAVE1=$(sort -u "$MISSING_FILE")
          if [ -n "$MISSING_WAVE1" ]; then
            echo "::warning::$(echo "$MISSING_WAVE1" | grep -c .) function(s) were targeted but printed NO completion line (no success, no failure) — the quota-dropped-update mode from run 32074172766. Retrying them as stragglers."
            echo "$MISSING_WAVE1" | sed 's/^/    unaccounted-for: /'
          fi

          # ── retry rounds: only the stragglers, batched + paused ──
          round=0
          while [ -n "$FAILED" ] && [ "$round" -lt "$NBD_DEPLOY_RETRY_ROUNDS" ]; do
            round=$((round+1))
            echo "::warning::$(echo "$FAILED" | grep -c .) function(s) failed to deploy (likely Cloud Run CPU-quota healthcheck) — retry round $round/$NBD_DEPLOY_RETRY_ROUNDS after ${NBD_DEPLOY_RETRY_PAUSE}s"
            echo "$FAILED" | sed 's/^/    straggler: /'
            sleep "$NBD_DEPLOY_RETRY_PAUSE"
            : > "$FAILED_FILE"
            : > "$MISSING_FILE"
            _deploy_batched "$FAILED"
            FAILED=$(sort -u "$FAILED_FILE")
          done
          MISSING=$(sort -u "$MISSING_FILE")

          if [ -s "$WHOLESALE_FILE" ] && [ -z "$FAILED" ]; then
            echo "::error::Cloud Functions deploy failed WHOLESALE (nonzero exit before per-function rollout) — nothing or almost nothing was deployed"
            {
              echo "### ❌ Cloud Functions deploy — wholesale failure"
              echo ""
              echo "The firebase-tools deploy exited nonzero WITHOUT any per-function"
              echo "failure lines — it died before per-function rollout (auth, config,"
              echo "or quota abort). Until 2026-08-10 this exact mode reported"
              echo "\"✓ All functions deployed\" and went green."
              echo ""
              sed 's/^/  - /' "$WHOLESALE_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Cloud Functions still failing after $NBD_DEPLOY_RETRY_ROUNDS retries"
            {
              echo "### ❌ Cloud Functions deploy — unresolved after $NBD_DEPLOY_RETRY_ROUNDS retries"
              echo ""
              echo "These functions did NOT deploy even after batched retries:"
              echo ""
              echo "$FAILED" | sed 's/^/  - /'
              echo ""
              if [ -n "$MISSING" ]; then
                echo "Of those, these printed NO completion line at all in the final"
                echo "round — no success, no error. That is the **quota-dropped update**"
                echo "mode (run 32074172766, 2026-08-17): a mutation-rate 429"
                echo "(\`Per project mutation requests per minute\`) during a large burst"
                echo "loses the update while firebase-tools still exits 0. Before this"
                echo "guard existed the job went GREEN with stale code live."
                echo ""
                echo "$MISSING" | sed 's/^/  - /'
                echo ""
                echo "Deploy them by hand to confirm, e.g.:"
                echo ""
                echo '```'
                echo "npx firebase-tools deploy --only $(echo "$MISSING" | sed 's/^/functions:/' | paste -sd, -) --project $PRO_PROJECT --force"
                echo '```'
                echo ""
                # Report the LIVE knob value rather than hardcoding advice.
                # This block used to say 'set it to "60"' and went stale the day
                # it was actually set to 60 — telling an operator mid-incident to
                # do something already done.
                if [ "${NBD_DEPLOY_WAVE1_MAX:-0}" -gt 0 ]; then
                  echo "Wave 1 was ALREADY chunked (\`NBD_DEPLOY_WAVE1_MAX\` = ${NBD_DEPLOY_WAVE1_MAX}),"
                  echo "so the burst cap did not prevent this. Lower it (40, then 20) if drops"
                  echo "persist — but the durable fix is a **Cloud Functions per-project"
                  echo "mutation-rate quota increase**, which removes the need to chunk at all."
                else
                  echo "Wave 1 is NOT chunked (\`NBD_DEPLOY_WAVE1_MAX\` = 0). Set it to ~60 in"
                  echo "this workflow to flatten the mutation burst."
                fi
                echo ""
              fi
              echo "If the per-function error is \`Container Healthcheck failed. Quota"
              echo "exceeded for total allowable CPU per project per region\`, the batched"
              echo "retry wasn't enough headroom — the durable fix is a **Cloud Run CPU"
              echo "quota increase** for \`us-central1\` (GCP console → IAM & Admin →"
              echo "Quotas → filter \"Cloud Run Admin API\" / \"Total allowable CPU\")."
              echo "Otherwise these are a genuine deploy failure worth investigating."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Deliberately reports what was VERIFIED, not what was attempted: every
          # targeted function was reconciled against a terminal per-function line.
          echo "✓ All $COUNT targeted function(s) accounted for by a completion line$( [ "$round" -gt 0 ] && echo " (after $round straggler-retry round(s))" )."

      # Second pass: retry the skip-list with tolerance. If the blocker
      # has since cleared (i.e. the project was upgraded to GCIP), these
      # succeed. If not, the warning is surfaced in the workflow summary
      # and the rest of the deploy (Hosting, etc.) continues. A skipped
      # function still runs its LAST deployed revision — it's the update
      # that fails, not the runtime.
      # Renamed 2026-08-17: was "IAM-blocked retry", which was wrong on
      # both counts — the roles are granted, and the actual blocker is
      # the project not being on Identity Platform.
      - name: Deploy Cloud Functions (tolerant — skip-list retry)
        # ROOT-CAUSE FIX (deploy run 27631207476 starved Hosting): this retry
        # of the GCIP/IAM-blocked skip-list (onRepSignup) had NO step timeout,
        # so it ran until the job timeout-minutes cap canceled the WHOLE job —
        # the canceled job skipped the Deploy Hosting step below, even though
        # this step's comment promises "the rest of the deploy (Hosting, etc.)
        # continues." continue-on-error + a step timeout make that promise real:
        # a slow/hung retry self-bounds and the job proceeds to Hosting.
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
          NBD_DEPLOY_SKIP_LIST: "onRepSignup"
        run: |
          set +e
          RETRY=""
          for fn in $(echo "$NBD_DEPLOY_SKIP_LIST" | tr ',' ' '); do
            RETRY="${RETRY},functions:${fn}"
          done
          RETRY="${RETRY#,}"
          echo "Attempting tolerant deploy of: $RETRY"
          npx firebase-tools deploy --only "$RETRY" --project "$PRO_PROJECT" --non-interactive --force
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            {
              echo "### ⚠ Blocking-trigger function couldn't update (expected until GCIP)"
              echo ""
              echo "The following functions were NOT updated this deploy:"
              echo ""
              for fn in $(echo "$NBD_DEPLOY_SKIP_LIST" | tr ',' ' '); do
                echo "  - $fn"
              done
              echo ""
              echo "Their last-deployed revisions are still live in Cloud Run."
              echo ""
              echo "\`onRepSignup\` is a **blocking trigger**, and this is NOT an IAM"
              echo "problem. \`nobigdeal-pro\` is subtype FIREBASE_AUTH, and blocking"
              echo "functions are GCIP-only, so the registration call fails with"
              echo "\`OPERATION_NOT_ALLOWED : Blocking Functions may only be configured"
              echo "for GCIP projects\`. No IAM grant fixes this — the project must be"
              echo "upgraded to Identity Platform. The trigger is inert in the meantime"
              echo "(blockingFunctions is \`{}\`); claim-minting runs through the"
              echo "callable fallbacks."
              echo "See documentation/audit/BLOCKING-TRIGGERS-NOT-GCIP-2026-08-17.md"
              echo ""
              echo "**If anything OTHER than a blocking trigger is listed above**"
              echo "(e.g. a scheduled function), that is new. Scheduled functions have"
              echo "deployed cleanly since 2026-04-14 and \`roles/cloudscheduler.admin\`"
              echo "is granted — diagnose it fresh rather than reaching for IAM."
              echo ""
              echo "Runbook: POST_DEPLOY_CHECKLIST.md §16."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Blocking-trigger function deferred (GCIP, not IAM) — see summary"
          else
            echo "✓ Skip-list functions deployed cleanly — the GCIP blocker is gone. Empty NBD_DEPLOY_SKIP_LIST in the workflow."
          fi
          exit 0

      # Orphan check (2026-09-04). Eight functions retired from source on
      # 2026-08-06 and 2026-08-11 stayed deployed for four months across many
      # green deploys, because nothing compared the fleet to the code. See the
      # corrected --force comment above: Firebase only detects orphans on an
      # UNFILTERED functions deploy, and this workflow always names targets.
      #
      # Runs AFTER the tolerant retry so a function deployed moments ago is
      # never reported MISSING. gcloud is already authenticated by the
      # "Enable required Google APIs" step earlier in this job.
      #
      # The exit code propagates deliberately, including exit 2 ("could not
      # determine"). A checker that cannot read either list must not be
      # indistinguishable from a clean fleet — that is the exact false-green
      # this check was built to end, and gcloud is already load-bearing in two
      # earlier steps, so this adds no new fragility. A real orphan turns the
      # deploy job red AFTER a successful rollout: a signal to clean up, not a
      # rollback.
      - name: Fleet must match the code — no orphaned or missing functions
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        env:
          NBD_PROJECT: ${{ env.PRO_PROJECT }}
        run: node scripts/check-function-orphans.js

      - name: Wipe service-account JSON from runner
        if: always()
        run: rm -f "${{ steps.sa.outputs.sa_path }}"

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "### ✓ Firebase deploy complete"
            echo ""
            echo "| Component | Project | Status |"
            echo "|---|---|---|"
            echo "| Firestore rules | $PRO_PROJECT | deployed |"
            echo "| Storage rules | $PRO_PROJECT | deployed |"
            echo "| Cloud Functions | $PRO_PROJECT | deployed |"
            echo "| Hosting | $PRO_PROJECT | deployed |"
            echo ""
            echo "Next: run \`./scripts/verify-deploy.sh\` against the live URLs to confirm the smoke tests pass."
          } >> "$GITHUB_STEP_SUMMARY"
