name: Lead address audit

# ─────────────────────────────────────────────────────────────
# WHY THIS EXISTS
# ─────────────────────────────────────────────────────────────
# A pre-Wave-141 bug in the address autocomplete stored mangled strings
# ("7003, Wrenfield Trace, O'Bannon Creek" — comma after the house number,
# no ZIP, no state, a Nominatim hamlet where the post town belongs). The write
# path is fixed, doc generation now blocks on an incomplete address, and the
# 2026-08-18 backfill repaired every affected record.
#
# None of that is a guarantee. The corruption lived in DATA, not code, and the
# repo's own test suite structurally cannot see Firestore. Without this
# workflow, "every address stays fixed" is a claim somebody has to keep
# re-verifying by hand — which means, eventually, nobody does.
#
# So: run the audit on a schedule, and fail loudly when a mangled or blank
# address reappears. `noStreet` (city + ZIP but no street) does NOT fail the
# run — that data is missing rather than broken, and only the customer can
# supply it.
#
# ─────────────────────────────────────────────────────────────
# SECRET (shared with firebase-deploy.yml — no new setup needed)
# ─────────────────────────────────────────────────────────────
# Name:  FIREBASE_SERVICE_ACCOUNT
# Needs: Cloud Datastore User (read is enough — this script never writes).
#
# Until that secret is set, every run is a quick "skipped" notice, NOT a
# failure email. Same convention as the deploy workflow.
#
# ─────────────────────────────────────────────────────────────
# firebase-admin — UNPINNED 2026-09-01 (was v12 via NODE_PATH)
# ─────────────────────────────────────────────────────────────
# This used to install firebase-admin@12 into a scratch dir and point NODE_PATH
# at it, on the stated rationale that "v14 changed Timestamp handling in a way
# that breaks the admin scripts in scripts/". Both halves of that were wrong,
# and by 2026-09 the pin had become the thing most likely to break this job.
#
# 1. The Timestamp claim was inherited boilerplate. audit-lead-addresses.js
#    reads `address`, `firstName` and `lastName` — all strings — and orders by
#    the string literal '__name__'. It touches no Timestamp at all. Measured
#    against real v14 Timestamp objects: no throw, byte-identical verdict.
#    (documentation/audit/ADMIN-SCRIPTS-ADMIN-PORT-2026-09-01.md §1)
#
# 2. NODE_PATH DEFEATS scripts/_admin.js rather than feeding it. _admin tries a
#    bare `require.resolve('firebase-admin')` FIRST and only falls back to the
#    functions/ resolver when that throws. A NODE_PATH tree satisfies the bare
#    resolve, so the pin silently decided which firebase-admin the script got —
#    overriding the single-resolver guarantee _admin exists to provide, for the
#    one run nobody is watching. (§2 of the same note.)
#
# So the scratch install is gone and the audit now runs on the SAME
# firebase-admin the CRM does: functions/package-lock.json, currently 14.3.0.
# No NODE_PATH is set — _admin's bare resolve fails on the runner (neither
# scripts/ nor the repo root has node_modules) and it falls back to
# functions/, which is the designed path.
#
# Do not reintroduce NODE_PATH here. If this job ever needs a specific
# firebase-admin, change functions/package.json so the whole repo moves
# together.

on:
  schedule:
    # 11:00 UTC daily — around 6-7am Cincinnati, so a failure is sitting in
    # the inbox before the first customer call of the day rather than after.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      list:
        description: 'Print every offending record, not just the summary'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit lead addresses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_VERSION: '22'
      NBD_PROJECT: nobigdeal-pro

    steps:
      - uses: actions/checkout@v7

      - name: Check the service-account secret is configured
        id: gate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is set — running the address audit."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Lead address audit — skipped"
              echo ""
              echo "The \`FIREBASE_SERVICE_ACCOUNT\` repository secret is not configured,"
              echo "so there are no credentials to read Firestore with."
              echo ""
              echo "Set it under **Settings → Secrets and variables → Actions**"
              echo "(the same secret the deploy workflow uses) and this audit"
              echo "starts running on its own."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set — skipping the audit (not a failure)."
          fi

      - name: Set up Node
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Written via an env var rather than shell interpolation — the pattern
      # GitHub recommends, and it keeps the secret out of the run log.
      - name: Write service-account JSON to a temp file
        if: steps.gate.outputs.configured == 'true'
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_FILE="$RUNNER_TEMP/nbd-audit-sa.json"
          printf '%s' "$SA_JSON" > "$SA_FILE"
          if [ ! -s "$SA_FILE" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT resolved to empty."
            exit 1
          fi
          echo "sa_path=$SA_FILE" >> "$GITHUB_OUTPUT"

      # scripts/_admin.js resolves firebase-admin out of functions/, so that is
      # where it has to be installed. Same step as ci.yml's "Functions parse +
      # dep install", including the `npm ci` → `npm install` fallback for a
      # branch that adds a dep before the lock is regenerated.
      - name: Install functions deps (supplies firebase-admin to scripts/_admin.js)
        if: steps.gate.outputs.configured == 'true'
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi
          # Relative path on purpose: firebase-admin's exports map does not
          # expose ./package.json, so a bare require of it throws.
          echo "::notice::audit will run on firebase-admin $(node -p "require('./node_modules/firebase-admin/package.json').version")"

      # The gate itself. audit-lead-addresses.js exits non-zero when any
      # `legacyMangled` or `blank` address remains, so a regression turns this
      # job red and GitHub emails the repo owner. Output is captured so the
      # offending records land in the run summary — as Firestore doc ids ONLY.
      # This repo is public, and so are its run logs and summaries: from
      # 2026-08-20 to 2026-09-28 they carried customers' names, addresses and
      # job values. The script now redacts itself whenever GITHUB_ACTIONS=true
      # (tests/address-audit-script.test.js pins it); open an id in NBD Pro, or
      # run the script locally for the full list.
      - name: Run the audit
        if: steps.gate.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
          # No NODE_PATH. scripts/_admin.js resolves firebase-admin out of
          # functions/ on its own; setting NODE_PATH would override that.
        run: |
          set -o pipefail
          FLAGS=""
          if [ "${{ github.event_name }}" != 'workflow_dispatch' ] || [ "${{ inputs.list }}" = 'true' ]; then
            FLAGS="--list"
          fi
          {
            echo "### Lead address audit"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          node scripts/audit-lead-addresses.js $FLAGS 2>&1 | tee "$RUNNER_TEMP/audit.txt"
          STATUS=${PIPESTATUS[0]}
          set -e

          cat "$RUNNER_TEMP/audit.txt" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            {
              echo "**A mangled or blank address is back in the CRM.**"
              echo ""
              echo "Fix it in NBD Pro, or add a verified correction to the"
              echo "PRIVATE corrections file (customer data, kept out of this public repo) and run:"
              echo ""
              echo '```'
              echo "node scripts/backfill-legacy-addresses.js --data=<corrections.json>               # dry run"
              echo "node scripts/backfill-legacy-addresses.js --data=<corrections.json> --apply --yes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Address audit failed — see the job summary for the offending records."
          fi
          exit "$STATUS"
