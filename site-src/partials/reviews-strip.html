<section class="reviews-strip" aria-labelledby="reviews-strip-title" style="background:#f6f4f0;border-top:1px solid #e8e5e0;padding:56px 20px">
  <div style="max-width:1100px;margin:0 auto">
    <div style="text-align:center;margin-bottom:28px">
      <p style="margin:0 0 8px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A14A22">What homeowners say</p>
      <h2 id="reviews-strip-title" style="margin:0;font-size:clamp(1.5rem,3.2vw,2.1rem);line-height:1.15;color:#12223d">Recent Google reviews</h2>

    </div>
    <div data-nbd-google-reviews></div>
    <div style="text-align:center;margin-top:24px">
      <a href="/review" style="display:inline-block;padding:12px 22px;border:1px solid rgba(18,34,61,.35);border-radius:100px;color:#12223d;font-weight:700;font-size:.9rem;text-decoration:none">Read all our Google reviews &rarr;</a>

  </div>
