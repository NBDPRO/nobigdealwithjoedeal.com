<!-- Recent Google reviews with their dates, on every homeowner page (2026-10-24).
     Cards come from google-reviews-widget.js; no rating or count is written here. -->
<link rel="stylesheet" href="/assets/css/reviews-strip.css">
<section class="reviews-strip" aria-labelledby="reviews-strip-title">
  <div class="reviews-strip-inner">
    <div class="reviews-strip-head">
      <p class="reviews-strip-eyebrow">What homeowners say</p>
      <h2 id="reviews-strip-title" class="reviews-strip-title">Recent Google reviews</h2>
      <p class="reviews-strip-lede">The newest reviews from our Google Business Profile, each with its date. Nothing is picked or edited.</p>
    </div>
    <div data-nbd-google-reviews></div>
    <div class="reviews-strip-more">
      <a href="/review" class="reviews-strip-all">Read all our Google reviews &rarr;</a>
    </div>
  </div>
</section>
<script src="/assets/js/google-reviews-widget.js" defer></script>
