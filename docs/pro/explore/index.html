<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NBD Pro Sample Account</title>
  <meta name="description" content="A sample roofing company inside the real NBD Pro CRM. It runs entirely in your browser: nothing is saved to NBD Pro or sent to anyone.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/pro/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0B1526">
  <link rel="stylesheet" href="/assets/css/nbd-fonts-pro.css">
  <link rel="stylesheet" href="/pro/css/landing.css?v=2">
  <link rel="stylesheet" href="/pro/explore/explore-entry.css?v=1">
  <!-- Opens the sample account: registers /pro/explore/demo-sw.js (scope
       /pro/explore/), which swaps the Firebase SDK for the in-browser fake,
       then moves to the real dashboard under /pro/explore/. No Firebase, no
       analytics, no network calls beyond this site's own static files. -->
  <script defer src="/pro/explore/explore-entry.js?v=1"></script>
</head>
<body class="xe">
  <main class="xe-card" id="main">
    <p class="pl-eyebrow">Sample account</p>
    <h1>Opening a sample roofing company…</h1>
    <p class="xe-lede" id="xe-status" aria-live="polite">Setting up the sample account in this browser.</p>
    <p class="xe-note">Everything here is made up and stays in your browser. Nothing is saved to NBD Pro or sent to anyone.</p>
    <div class="xe-actions" id="xe-actions" hidden>
      <a class="pl-btn pl-btn-primary" href="/pro/register.html">Start free, no card</a>
      <a class="pl-btn pl-btn-ghost" href="/pro/sandbox">Watch the guided demo</a>
    </div>
    <noscript><p class="xe-lede">The sample account needs JavaScript. You can still <a href="/pro/sandbox">watch the guided demo</a> or <a href="/pro/register.html">start free</a>.</p></noscript>
  </main>
</body>
</html>
