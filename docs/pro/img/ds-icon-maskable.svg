<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Daily Success">
  <!-- Daily Success app icon (purpose "maskable"): full-bleed tile, the mark scaled to 72% so it sits inside the 80% safe-zone circle. -->
  <rect width="512" height="512" fill="#12223D"/>
  <g transform="translate(256 256) scale(.72) translate(-256 -256)">
    <circle cx="256" cy="256" r="132" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="40"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="#BD5728" stroke-width="40" stroke-linecap="round" stroke-dasharray="663 830" transform="rotate(-90 256 256)"/>
    <polyline points="198,262 240,304 320,216" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
