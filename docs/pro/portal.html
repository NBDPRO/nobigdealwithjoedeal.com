<!doctype html>
<html lang="en" data-nbd-brand="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your Project</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<!-- Photo system Phase 1 (2026-05-13): customer-facing surfaces use the
     locked nbd-brand.css token system, not the rep-side theme system.
     The portal always renders in official NBD brand (light base, orange
     accent) regardless of what theme the rep picked for their dashboard
     — that's how every shared link/PDF/portal looks like the same
     company. See docs/pro/css/nbd-brand.css. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/nbd-brand.css">
<style>
  /* Page-local styling — only structural rules. Every color/font/space
     reads from the brand token set. Adding a token would mean editing
     nbd-brand.css; the page itself stays palette-free. */
  /* The shared portal.js component markup was authored against the rep-side
     dark-theme token names (--bg / --br / --text / --muted / --accent /
     --surface-2). This portal renders on the light NBD brand, which only
     defines the --nbd-* tokens, so those refs fell back to their hard-coded
     DARK values (e.g. --bg → #0a1424) and rendered dark-on-dark — the
     homeowner couldn't see what they typed into the message / callback /
     rating inputs. Alias the rep tokens to the brand tokens so inputs and
     panels are readable and on-brand. */
  :root {
    --bg: var(--nbd-bg-sunken);
    --br: var(--nbd-line);
    --text: var(--nbd-ink);
    --muted: var(--nbd-ink-muted);
    /* --nbd-orange-cta (4.88:1), NOT --nbd-orange (3.07:1, fails AA —
       nbd-brand.css:55-59 says so itself). Every CTA portal.js generates
       carries an inline background:var(--accent), which beats .btn's class
       rule, so the safe token on .btn was being overridden on every button:
       Send, Send callback, Send rating, Choose a photo, Start a warranty
       claim, Leave a Google review. Repointing the alias fixes all of them
       without editing a single generated string. Every --accent consumer is
       an accent BACKGROUND under white ink, a border, or accent text on the
       cream page, so the browner token only ever helps. */
    --accent: var(--nbd-orange-cta);
    --green: var(--nbd-success);
      --orange: var(--nbd-orange);
      --surface-2: var(--nbd-bg-tint);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--nbd-bg);
    color: var(--nbd-ink);
    font-family: var(--nbd-font-body);
    font-size: var(--nbd-text-md);
    line-height: var(--nbd-leading-body);
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    background: linear-gradient(135deg, var(--nbd-orange-soft), rgba(189,87,40,0));
    border-bottom: 1px solid var(--nbd-line);
    padding: var(--nbd-space-8) var(--nbd-space-5) var(--nbd-space-6);
  }
  .hero-inner {
    max-width: 820px;
    margin: 0 auto;
  }
  .hero-mark {
    display: flex;
    align-items: center;
    gap: var(--nbd-space-3);
    margin-bottom: var(--nbd-space-4);
  }
  .hero-logo {
    /* Uses nbd-logo-light-bg.png (navy text), not the site-wide
       nbd-logo.png — that asset was recolored white-on-purpose by #1572
       for the nav/footer's dark navy background, and this hero sits on a
       light orange-tinted gradient (.hero above), where white text reads
       as a near-invisible blank. Rendered from the same brand-pack SVG
       (logo-color.svg) #1572 started from, before its white recolor. */
    height: 44px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  .hero-brand {
    font-family: var(--nbd-font-display);
    font-size: var(--nbd-text-xs);
    letter-spacing: var(--nbd-tracking-widest);
    text-transform: uppercase;
    color: var(--nbd-orange);
    font-weight: 700;
    margin: 0;
  }
  .hero-title {
    font-family: var(--nbd-font-display);
    font-size: var(--nbd-text-3xl);
    font-weight: 800;
    line-height: var(--nbd-leading-tight);
    color: var(--nbd-ink);
    margin-bottom: var(--nbd-space-1);
  }
  .hero-sub {
    color: var(--nbd-ink-muted);
    font-size: var(--nbd-text-sm);
  }
  main {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: var(--nbd-space-5);
  }
  .card {
    background: var(--nbd-bg-elevated);
    border: 1px solid var(--nbd-line);
    border-radius: var(--nbd-radius-lg);
    padding: var(--nbd-space-5);
    margin-bottom: var(--nbd-space-4);
    box-shadow: var(--nbd-shadow-sm);
  }
  .card-label {
    font-family: var(--nbd-font-display);
    font-size: 10px;
    letter-spacing: var(--nbd-tracking-widest);
    text-transform: uppercase;
    color: var(--nbd-ink-muted);
    margin-bottom: var(--nbd-space-2);
    font-weight: 700;
  }
  .card-title {
    font-family: var(--nbd-font-display);
    font-size: var(--nbd-text-xl);
    font-weight: 800;
    color: var(--nbd-ink);
    margin-bottom: var(--nbd-space-3);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--nbd-space-4);
  }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  .kv-key {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: var(--nbd-tracking-widest);
    color: var(--nbd-ink-subtle);
    font-family: var(--nbd-font-display);
    font-weight: 700;
  }
  .kv-val {
    font-size: var(--nbd-text-md);
    color: var(--nbd-ink);
    margin-top: 2px;
  }
  .big-num {
    font-family: var(--nbd-font-display);
    font-size: var(--nbd-text-3xl);
    font-weight: 800;
    color: var(--nbd-orange);
    line-height: 1;
  }
  .pill {
    display: inline-block;
    font-size: var(--nbd-text-xs);
    font-weight: 700;
    letter-spacing: var(--nbd-tracking-wider);
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: var(--nbd-radius-pill);
    border: 1px solid var(--nbd-line);
  }
  .pill-green  { color: var(--nbd-success); border-color: rgba(22,163,74,.35); background: var(--nbd-success-soft); }
  .pill-orange { color: var(--nbd-orange-ink); border-color: var(--nbd-orange-medium); background: var(--nbd-orange-soft); }
  .pill-red    { color: var(--nbd-danger); border-color: rgba(220,38,38,.35); background: var(--nbd-danger-soft); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--nbd-font-display);
    font-size: var(--nbd-text-sm);
    font-weight: 700;
    letter-spacing: var(--nbd-tracking-wider);
    text-transform: uppercase;
    background: var(--nbd-orange-cta);
    color: var(--nbd-ink-on-orange);
    border: none;
    padding: 13px 22px;
    border-radius: var(--nbd-radius-md);
    cursor: pointer;
    text-decoration: none;
    min-height: 46px;
    transition: background .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover  { background: var(--nbd-orange-cta-deep); box-shadow: var(--nbd-shadow-md); }
  .btn:active { transform: scale(.98); }
  .btn-ghost {
    background: transparent;
    color: var(--nbd-orange);
    border: 1px solid var(--nbd-orange);
  }
  .btn-ghost:hover { background: var(--nbd-orange-soft); }
  .cal-embed {
    width: 100%;
    height: 680px;
    border: 1px solid var(--nbd-line);
    border-radius: var(--nbd-radius-lg);
    background: #fff;
  }
  /* Phone audit (2026-09-25): this used to RAISE the embeds to 820px on
     phones — taller than any phone's visible viewport. With the frame
     filling the whole screen, every swipe landed inside it: five 400px
     swipes scrolled the frame and left the page where it was, and the only
     page-scrolling strips were the 41px gutters either side. Two embeds in
     a row (sign, then book) meant trapping twice on the homeowner's most
     important flow.
     - The signing frame now always fits the SMALL viewport (URL bar shown)
       with a band of page above or below it to scroll by. 72svh: 620px at
       860 tall, 560 on a Pixel-sized Chrome; floor 420 so it never gets too
       short to sign in. The vh line is the fallback for pre-svh browsers.
     - The booking calendar does not render inline on phones at all: its
       "Open Booking Page" button (already under it) opens the same Cal.com
       page full-screen, which is how Cal.com is built to be used on a
       phone, and a hidden lazy iframe is never fetched. The estimate
       walkthrough page alone is ~1780px tall, so any inline height traps. */
  @media (max-width: 600px) {
    .cal-embed { height: clamp(420px, 72vh, 820px); height: clamp(420px, 72svh, 820px); }
    .cal-embed[data-embed="booking"] { display: none; }
  }
  /* iOS zoom (phone audit, 2026-09-25): iOS Safari zooms the page in on
     focus of any text control under 16px and leaves it zoomed, so the
     homeowner pinches back out after every message. portal.js renders its
     message / callback / rating / warranty / referral / photo-caption
     fields at 12-14px via inline styles, hence !important. Same rule the
     rep side carries (dashboard-app.css "Global iOS auto-zoom kill"), which
     this page does not load; (pointer: coarse) also covers an iPad held
     landscape, wider than 900. Desktop keeps the inline sizes. */
  @media (max-width: 900px), (pointer: coarse) {
    input, select, textarea { font-size: max(16px, 1em) !important; }
  }
  /* Documents shelf (2026-09-16) */
  .doc-list { margin-top: var(--nbd-space-3); display: flex; flex-direction: column; gap: var(--nbd-space-2); }
  .doc-row {
    display: flex; align-items: center; justify-content: space-between; gap: var(--nbd-space-3);
    padding: var(--nbd-space-3); border: 1px solid var(--nbd-line); border-radius: var(--nbd-radius-md);
    background: var(--nbd-bg-sunken);
  }
  .doc-info { min-width: 0; }
  .doc-name {
    font-weight: 700; color: var(--nbd-ink); font-size: var(--nbd-text-sm);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-meta { font-size: var(--nbd-text-xs); color: var(--nbd-ink-subtle); margin-top: 2px; }
  .doc-row .btn { flex-shrink: 0; }

  /* Sandboxed document viewer modal — see wirePortalDocumentsCard's comment
     in portal.js for why generated documents render in an opaque-origin
     iframe (srcdoc) rather than a direct link. */
  /* z: --z-overlay, above the floating Live pill (--z-fab) and below the
     update banner (--z-toast) — see _showLivePill in portal.js. Was 1000,
     which put the pill on top of the open viewer (phone audit 2026-09-25). */
  .doc-modal-overlay {
    display: none; position: fixed; inset: 0; z-index: var(--z-overlay, 10000);
    background: rgba(15,17,21,.72); padding: var(--nbd-space-4);
    align-items: center; justify-content: center;
  }
  .doc-modal-overlay.open { display: flex; }
  .doc-modal {
    width: 100%; max-width: 820px; height: 88vh;
    background: #fff; border-radius: var(--nbd-radius-lg);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--nbd-shadow-md);
  }
  .doc-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--nbd-space-3) var(--nbd-space-4);
    border-bottom: 1px solid var(--nbd-line); flex-shrink: 0;
  }
  .doc-modal-title { font-weight: 700; color: var(--nbd-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-modal-close {
    border: none; background: transparent; font-size: 18px; line-height: 1; cursor: pointer;
    color: var(--nbd-ink-subtle); padding: var(--nbd-space-2);
  }
  .doc-modal-body { flex: 1; position: relative; min-height: 0; }
  .doc-modal-status { padding: var(--nbd-space-4); color: var(--nbd-ink-subtle); text-align: center; }
  .doc-modal-iframe { width: 100%; height: 100%; border: none; display: none; }
  /* Phone audit homeowner#2 (2026-09-25): on a phone the viewer IS the
     screen. The dimmed 16px margin round a rounded card cost the document
     32px of a 360px screen, and the contract's phone layout
     (js/doc-phone-layout.js) is sized for the full width — at 328px its
     five-column scope table no longer fits. Safe-area padding keeps the
     header off the notch (viewport-fit=cover), and Close is finger-sized:
     it was 34px, and it is the only way out of the viewer. */
  @media (max-width: 600px) {
    .doc-modal-overlay {
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    .doc-modal { max-width: none; height: 100%; border-radius: 0; box-shadow: none; }
    .doc-modal-close { min-width: 44px; min-height: 44px; }
  }

  /* Project photo gallery — square tiles, generous spacing.
     Tap a tile to open the full 1600px variant in a new tab. */
  .ph-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: var(--nbd-space-2);
    margin-top: var(--nbd-space-3);
  }
  .ph-tile {
    display: block;
    aspect-ratio: 1;
    border-radius: var(--nbd-radius-md);
    overflow: hidden;
    background: var(--nbd-bg-sunken);
    border: 1px solid var(--nbd-line);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .ph-tile:hover { transform: translateY(-1px); box-shadow: var(--nbd-shadow-md); }
  .ph-tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

  /* Phase 5: Phase tabs + location filter chips above the gallery */
  .ph-tabs {
    display: flex; gap: var(--nbd-space-2);
    margin: var(--nbd-space-3) 0 var(--nbd-space-2);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .ph-tab {
    border: 1px solid var(--nbd-line);
    background: var(--nbd-bg-elevated);
    color: var(--nbd-ink-muted);
    font-family: var(--nbd-font-display);
    font-size: var(--nbd-text-sm);
    font-weight: 700;
    letter-spacing: var(--nbd-tracking-wide);
    padding: 7px 14px;
    border-radius: var(--nbd-radius-pill);
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .ph-tab:hover { border-color: var(--nbd-orange); color: var(--nbd-ink); }
  .ph-tab[aria-pressed="true"] {
    background: var(--nbd-orange-cta); color: var(--nbd-ink-on-orange);
    border-color: var(--nbd-orange);
  }
  .ph-tab-count {
    font-family: var(--nbd-font-body); font-weight: 600;
    background: rgba(0,0,0,.10); padding: 1px 7px; border-radius: 10px;
    font-size: 11px;
  }
  .ph-tab[aria-pressed="true"] .ph-tab-count {
    background: rgba(255,255,255,.22);
  }
  .ph-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 0 0 var(--nbd-space-3);
  }
  .ph-chip {
    border: 1px solid var(--nbd-line);
    background: var(--nbd-bg-elevated);
    color: var(--nbd-ink-muted);
    font-family: var(--nbd-font-body);
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--nbd-radius-pill);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .ph-chip:hover { border-color: var(--nbd-orange); color: var(--nbd-ink); }
  .ph-chip-active {
    background: var(--nbd-orange-soft); border-color: var(--nbd-orange);
    color: var(--nbd-orange-ink);
  }
  .ph-chip-count {
    font-weight: 500; color: var(--nbd-ink-subtle); font-size: 10.5px;
  }
  .ph-empty {
    padding: var(--nbd-space-6) var(--nbd-space-4);
    text-align: center; color: var(--nbd-ink-subtle);
    font-size: var(--nbd-text-sm);
    border: 1px dashed var(--nbd-line);
    border-radius: var(--nbd-radius-md);
    margin-top: var(--nbd-space-3);
  }
  .error-state, .loading-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--nbd-ink-muted);
  }
  .error-state h2 {
    font-family: var(--nbd-font-display);
    font-size: var(--nbd-text-2xl);
    color: var(--nbd-danger);
    margin: var(--nbd-space-2) 0 var(--nbd-space-3);
  }
  footer {
    max-width: 820px;
    width: 100%;
    margin: var(--nbd-space-6) auto var(--nbd-space-10);
    padding: 0 var(--nbd-space-5);
    color: var(--nbd-ink-muted);
    font-size: var(--nbd-text-xs);
    text-align: center;
  }
  footer a { color: var(--nbd-orange); text-decoration: none; }

  /* ── Project progress tracker (9 steps, 2026-10-03) ──────────────
     Phone-first: the current step + "N of 9 done", a 9-segment bar, the
     step's sentence, its one action, the next step; the full list sits in a
     native <details>. Every state is a data-state attribute, so the render
     carries no inline style (CSP + the inline-style ratchet). Tap targets
     (summary, list rows, actions) are 44px. */
  .progress-card{ overflow:hidden; }
  .progress-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap: var(--nbd-space-3); flex-wrap:wrap;
  }
  .progress-count{
    font-size: var(--nbd-text-sm); font-weight:700; color: var(--nbd-ink-subtle);
    white-space:nowrap;
  }
  .progress-bar{ display:flex; gap:4px; margin-top: var(--nbd-space-3); }
  .progress-seg{ flex:1; height:6px; border-radius:3px; background: var(--nbd-line); }
  .progress-seg[data-state="done"]{ background: var(--nbd-success); }
  .progress-seg[data-state="current"]{ background: var(--nbd-orange); }
  .progress-seg[data-state="skipped"]{ opacity:.4; }
  .progress-blurb{
    margin: var(--nbd-space-3) 0 0; font-size: var(--nbd-text-md);
    line-height:1.5; color: var(--nbd-ink);
  }
  .progress-paid{
    margin: var(--nbd-space-2) 0 0; font-size: var(--nbd-text-sm);
    font-weight:700; color: var(--nbd-ink);
  }
  .progress-actions{
    display:flex; flex-wrap:wrap; gap: var(--nbd-space-2);
    margin-top: var(--nbd-space-3);
  }
  .progress-action{
    min-height:44px; display:inline-flex; align-items:center; justify-content:center;
  }
  .progress-all{ margin-top: var(--nbd-space-3); }
  .progress-all > summary{
    min-height:44px; display:flex; align-items:center; cursor:pointer;
    font-size: var(--nbd-text-sm); font-weight:700; color: var(--nbd-orange);
    list-style:none;
  }
  .progress-all > summary::-webkit-details-marker{ display:none; }
  .progress-all > summary::after{ content:'▾'; margin-left:6px; }
  .progress-all[open] > summary::after{ content:'▴'; }
  .progress-list{ list-style:none; margin:0; padding:0; }
  .progress-item{
    display:flex; align-items:center; gap: var(--nbd-space-3);
    min-height:44px; border-top:1px solid var(--nbd-line);
  }
  .progress-item-label{
    flex:1; min-width:0; font-size: var(--nbd-text-sm); font-weight:600;
    color: var(--nbd-ink-subtle);
  }
  .progress-item[data-state="done"] .progress-item-label,
  .progress-item[data-state="current"] .progress-item-label{ color: var(--nbd-ink); }
  .progress-item[data-state="current"] .progress-item-label{ font-weight:800; }
  .progress-dot{
    flex:none; width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--nbd-bg-elevated); border: 2px solid var(--nbd-line);
    font-size: var(--nbd-text-sm); font-weight:800; color: var(--nbd-ink-subtle);
  }
  .progress-item[data-state="done"] .progress-dot{
    background: var(--nbd-success); border-color: var(--nbd-success); color:#fff;
  }
  .progress-item[data-state="current"] .progress-dot{
    background: var(--nbd-orange); border-color: var(--nbd-orange); color:#fff;
    box-shadow:0 0 0 4px var(--nbd-orange-glow);
  }
  .progress-item[data-state="skipped"] .progress-dot{ border-style:dashed; }
  /* Only finished steps carry one (the current step isn't done yet). */
  .progress-step-date{
    font-size: var(--nbd-text-xs); font-weight:600; color: var(--nbd-ink-subtle);
    white-space:nowrap;
  }
  .progress-next{
    margin-top: var(--nbd-space-4); padding: var(--nbd-space-3) var(--nbd-space-4);
    background: var(--nbd-orange-soft); border: 1px solid var(--nbd-orange-medium);
    border-radius: var(--nbd-radius-md);
    font-size: var(--nbd-text-sm); color: var(--nbd-ink); line-height:1.5;
  }
  .progress-next-label{
    font-size:10px; font-weight:700; letter-spacing: var(--nbd-tracking-widest);
    text-transform: uppercase; color: var(--nbd-orange); margin-bottom: var(--nbd-space-1);
  }
  /* The install date. Weightier than "Next up" because it is the more
     specific fact — a homeowner opens this page for the date, not the
     milestone name. A past date (data-when="past") drops to the muted
     treatment: it is a record, not a promise, and must not read as one. */
  .progress-schedule{
    margin-top: var(--nbd-space-4); padding: var(--nbd-space-3) var(--nbd-space-4);
    background: var(--nbd-orange-soft); border: 1px solid var(--nbd-orange-medium);
    border-radius: var(--nbd-radius-md);
    font-size: var(--nbd-text-md); font-weight:700; color: var(--nbd-ink);
    line-height:1.4;
  }
  /* --nbd-line, not --nbd-border: the latter is defined only in
     photo-editor.css, which this page does not load, so it would have
     resolved to nothing. Six existing rules here already use --nbd-line. */
  .progress-schedule[data-when="past"]{
    background: transparent; border-color: var(--nbd-line);
    font-weight:600; color: var(--nbd-ink-subtle);
  }
  .progress-schedule + .progress-next{ margin-top: var(--nbd-space-2); }
  .progress-next-done{ background: transparent; border-color: var(--nbd-success); font-weight:700; }
  /* A week-planned job: the line plus what happens next (2026-09-29). */
  .progress-schedule-note{ margin-top: 4px; font-size: var(--nbd-text-sm, 13px); font-weight: 500; color: var(--nbd-ink-subtle); }
  /* Balance card: "Pay by bank (ACH) — lower fees" + the Zelle line
     (2026-10-04). portal.js adds no inline style for these. */
  .portal-pay-note{ color: var(--muted); margin: 8px 0 0; font-size: var(--nbd-text-sm, 14px); line-height: 1.5; }
  /* Balance card pay line + Payments card (2026-10-07, after-signing batch).
     portal.js adds no inline style for these. */
  .portal-pay-btn{ margin-top: 12px; }
  .portal-pay-wait{ color: var(--muted); margin: 12px 0 0; line-height: 1.5; }
  .paid-list{ list-style: none; margin: 10px 0 0; padding: 0; }
  .paid-row{
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--nbd-border, #e5e7eb);
  }
  .paid-row:first-child{ border-top: 0; }
  .paid-info{ min-width: 0; }
  .paid-amount{ font-weight: 700; font-variant-numeric: tabular-nums; }
  .paid-meta, .paid-ref{ color: var(--muted); font-size: var(--nbd-text-sm, 14px); line-height: 1.4; }
  .paid-ref{ text-align: right; flex-shrink: 0; }

  /* Print stylesheet (2026-09-16). A homeowner's real use case: handing an
     insurance adjuster a paper copy. Without this, the page printed as-is
     — interactive controls and all — which meant 6 pages, most of them
     blank boxes, because a cross-origin iframe (the Cal.com embed; the
     BoldSign one was retired 2026-10-04) doesn't rasterize in browser print at all. nbd-brand.css
     already swaps the color tokens for toner savings on print; this adds
     the missing LAYOUT half: strip everything a homeowner can't act on
     once it's on paper (embeds, buttons, form controls, the sandboxed
     document-viewer modal, the phase-filter tabs), keep everything that
     answers "what's the status of my project" (the header, the dated
     progress tracker, photos, document names/dates, the rep's contact
     info, the balance amount).
     One class list, not per-card exceptions: every interactive control on
     this page is consistently either a .btn/.btn-ghost anchor, a real
     <button>, or a form <input>/<textarea> — never bare text — so hiding
     those four selectors removes exactly the controls and nothing else,
     without needing a print-specific marker class on every card. */
  @media print {
    .cal-embed, .doc-modal-overlay, .ph-tabs, #livePill,
    button, input, textarea, a.btn, a.btn-ghost {
      display: none !important;
    }
    .card { break-inside: avoid; box-shadow: none; }
    .doc-row, .ph-tile { break-inside: avoid; }
  }
</style>
