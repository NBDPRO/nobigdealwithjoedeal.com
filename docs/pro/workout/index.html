<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Workout: the Workout Coach as its own home-screen app (2026-11-16). Same coach, same data as Daily Success
     (localStorage nbd_ds_workouts + users/{uid}/ds_workouts); only the screen is separate. The shared scripts below
     carry the SAME ?v= as docs/pro/daily-success/index.html (tests/ds-workout-installable-2026-11-16.test.js pins it),
     so both apps run one copy of the coach and share one offline cache entry per file. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0A0C0F">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/pro/workout.webmanifest">
<link rel="icon" href="/pro/img/workout-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pro/img/workout-apple-touch-icon.png">
<title>Workout — NBD Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/pro/js/dashboard-appcheck-config.js?v=1"></script>
<script type="module" src="/pro/daily-success/js/auth-init.js"></script>
<link rel="stylesheet" href="/pro/daily-success/css/workout-coach.css?v=24">
<link rel="stylesheet" href="/pro/workout/workout-app.css?v=7">
<!-- The Daily Success theme and accent saved on this device, set before the first paint (after the stylesheets: the accent reads the skin's card colour). -->
<script src="/pro/daily-success/js/accent-logic.js?v=1"></script>
<script src="/pro/daily-success/js/custom-theme-logic.js?v=2"></script>
<script src="/pro/workout/js/workout-theme.js?v=4"></script>
</head>
<body>
<header class="wa-top">
  <div class="wa-brand">
    <img class="wa-logo" src="/pro/img/workout-icon.svg" alt="" width="32" height="32">
    <div>
      <h1 class="wa-title">Workout</h1>
      <div class="wa-date" id="waDate"></div>
    </div>
  </div>
  <div class="wa-status" id="waStatus" role="status" aria-live="polite"></div>
</header>
<main class="wa-main">
  <div id="wcCard" class="wc-card wa-loading">Loading your workouts…</div>
  <a class="wa-link" id="waSignIn" href="/pro/login?redirect=workout" hidden>Sign in to back up your workouts and see them on every device</a>
  <!-- The Progress card (estimated 1RM per lift, 12-week volume): the same card Daily Success shows, drawn by workout-app.js. -->
  <div id="waProgress"></div>
  <a class="wa-link wa-link-quiet" href="/pro/daily-success">Open Daily Success</a>
  <!-- This app's own theme, or the Daily Success one (workout-theme.js setOwn). The names are the Daily Success theme names. -->
  <label class="wa-theme" for="waTheme">
    <span>Theme</span>
    <select id="waTheme">
      <option value="">Same as Daily Success</option>
      <option value="default">NBD Default</option>
      <option value="light">NBD Light</option>
      <option value="paper">Warm Paper</option>
      <option value="contrast">High Contrast</option>
      <option value="midnight">Midnight</option>
      <option value="forest">Forest</option>
      <option value="ocean">Ocean</option>
      <option value="ember">Ember</option>
      <option value="graphite">Graphite</option>
      <option value="terminal">Terminal</option>
    </select>
  </label>
  <!-- This app's own accent, the Daily Success one, or none (workout-theme.js setOwnAccent). The names are the Daily Success accent names. -->
  <label class="wa-theme" for="waAccent">
    <span>Accent</span>
    <select id="waAccent">
      <option value="">Same as Daily Success</option>
      <option value="none">Theme default</option>
      <option value="clay">Clay</option>
      <option value="teal">Teal</option>
      <option value="indigo">Indigo</option>
      <option value="plum">Plum</option>
      <option value="rose">Rose</option>
      <option value="moss">Moss</option>
      <option value="sky">Sky</option>
      <option value="amber">Amber</option>
    </select>
  </label>
</main>
<noscript><p class="wa-noscript">Workout needs JavaScript turned on.</p></noscript>

<script src="/pro/js/toast.js?v=1"></script>
<script src="/pro/daily-success/js/ds-sync-logic.js?v=4"></script>
<script src="/pro/daily-success/js/weekly-targets-logic.js?v=1"></script>
<script src="/pro/daily-success/js/nav-router.js?v=2"></script>
<script src="/pro/workout/js/workout-shell.js?v=1"></script>
<script src="/pro/daily-success/js/exercise-notes-logic.js?v=1"></script>
<script src="/pro/daily-success/js/workout-coach-logic.js?v=19"></script>
<script src="/pro/daily-success/js/volume-range-logic.js?v=1"></script>
<script src="/pro/daily-success/js/workout-coach.js?v=32"></script>
<script src="/pro/daily-success/js/floor-tick-logic.js?v=1"></script>
<script src="/pro/daily-success/js/look-sync.js?v=3"></script>
<script src="/pro/daily-success/js/progress-charts-logic.js?v=2"></script>
<script src="/pro/daily-success/js/progress-charts-ui.js?v=2"></script>
<script src="/pro/workout/js/workout-app.js?v=5"></script>
<script src="/pro/js/pages/sw-register.js" defer></script>
<script type="module" src="/pro/daily-success/ds-firebase-sync.js?v=13"></script>
</body>
</html>
