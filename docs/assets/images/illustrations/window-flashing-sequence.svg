ss="nb"><circle cx="70" cy="610" r="17"/><text x="70" y="616.5" text-anchor="middle">1</text></g><text x="98" y="617" class="lbl">Sill first</text><text x="53" y="652" class="nt">Tape across the sill,</text><text x="53" y="671" class="nt">turned up each side</text><g class="nb"><circle cx="355" cy="610" r="17"/><text x="355" y="616.5" text-anchor="middle">2</text></g><text x="383" y="617" class="lbl">Window in, then sides</text><text x="338" y="652" class="nt">Side tapes run past the</text><text x="338" y="671" class="nt">sill tape and above the head</text><g class="nb"><circle cx="640" cy="610" r="17"/><text x="640" y="616.5" text-anchor="middle">3</text></g><text x="668" y="617" class="lbl">Then the head</text><text x="623" y="652" class="nt">Head tape laps over</text><text x="623" y="671" class="nt">both side tapes</text><g class="nb"><circle cx="925" cy="610" r="17"/><text x="925" y="616.5" text-anchor="middle">4</text></g><text x="953" y="617" class="lbl">Wrap flap down</text><text x="908" y="652" class="nt">Housewrap folds over the</text><text x="908" y="671" class="nt">head tape; corners taped</text><path stroke="#bd5728" stroke-width="3" marker-end="url(#win-ar)" d="M303 360h22"/><path stroke="#bd5728" stroke-width="3" marker-end="url(#win-ar)" d="M588 360h22"/><path stroke="#bd5728" stroke-width="3" marker-end="url(#win-ar)" d="M873 360h22"/><text x="40" y="750" class="nt">Every piece laps the one below it, like shingles, so water that gets behind the siding runs out, not in.</text><g class="bdgbox"><rect width="332" height="28" x="32" y="850" fill="#fff" stroke="#12223d" stroke-width="1.2" rx="14"/><circle cx="50" cy="864" r="5" fill="#bd5728"/></g><text x="62" y="869" class="bdg">Illustration · not a photo of an actual job</text><text x="1160" y="869" class="ft" text-anchor="end">Generic sequence · OH &amp; KY R703.4 (window maker’s instructions govern)</text></svg>