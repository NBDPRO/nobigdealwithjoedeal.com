<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="win-t win-d" role="img" viewBox="0 0 1200 900"><title id="win-t">Window flashing, in order</title><desc id="win-d">Four steps to flash a window in a housewrapped wall, so every piece laps the one below it like shingles. 1: flashing tape across the sill, turned up the sides. 2: the window goes in and tape covers each side flange, running past the sill tape and above the head. 3: tape across the head flange, over the side tapes. 4: the housewrap flap above the window folds back down over the head tape and its cut corners are taped. Exact steps follow the window maker’s instructions; this is the common sequence. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ft{font:600 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.bdg{font:700 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ld{stroke:#12223d;stroke-width:1.1;opacity:.75}.dt{fill:#12223d;stroke:#fff;stroke-width:1.6}.nb circle{fill:#bd5728;stroke:#fff;stroke-width:2.5}.nb text{font:800 18px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff}.tag{font:800 12px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff;letter-spacing:.08em}.lstn{font:800 16px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}@media (max-width:640px){.lbl,.sub,.nt,.ntb,.ft,.bdg,.bdgbox,.eb,.hd,.mtxt,.lst,.inset{display:none}.nb{transform-box:fill-box;transform-origin:center;transform:scale(2.1)}.dl{font-size:30px;stroke-width:8px}.dt{r:6px}.ld{stroke-width:2.4}}</style><defs><marker id="win-ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#bd5728" d="m1 1 8 4-8 4z"/></marker></defs><path fill="#fff" d="M0 0h1200v900H0z"/><text x="40" y="46" class="eb">HOW IT’S BUILT · WINDOWS</text><text x="40" y="84" class="hd">Bottom up: sill, sides, head.</text><path fill="#d9bb8b" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m50 470 210.5 76.6V289L50 212.4z"/><path fill="#eef2f6" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m49.7 470.2 210.5 76.6V289.2L49.7 212.6z"/><path stroke="#b9c6d3" stroke-dasharray="2 6" stroke-width=".9" d="m54.9 427.4 199.9 72.8"/><path stroke="#b9c6d3" stroke-dasharray="2 6" stroke-width=".9" d="M54.9 360.2 254.8 433"/><path stroke="#b9c6d3" stroke-dasharray="2 6" stroke-width=".9" d="m54.9 293 199.9 72.8"/><path stroke="#b9c6d3" stroke-dasharray="2 6" stroke-width=".9" d="m54.9 237 199.9 72.8"/><path fill="#3b3f45" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m107.5 424.1 94.7 34.5V324.2l-94.7-34.5z"/><path fill="#c9cfd6" stroke="#12223d" stroke-linejoin="round" d="m94.1 433.5 121 44.1V430