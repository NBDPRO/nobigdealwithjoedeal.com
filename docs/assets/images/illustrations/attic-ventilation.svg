oke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="m690.5 647.9-4 1.8-77.2-71.3"/><path fill="#434a54" stroke="#12223d" stroke-linejoin="round" stroke-width=".9" d="m428.3 410.7 15.3-8.7 15.2 19.8v-2.5l-15.2-20.1-15.3 9z"/><g class="vf-group"><path fill="none" stroke="#2b78c5" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" marker-end="url(#vent-ai)" d="m179.2 502.9 3.4-22.1 10.1-9.9 74.4-12.5" class="vf vf-in"/><path fill="none" stroke="#c8643a" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" marker-end="url(#vent-ao)" d="m267.1 458.4 101.5-12.1 60.9-15.6 13.5-22.5-6.7-36.7" class="vf vf-out"/><path fill="none" stroke="#2b78c5" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" marker-end="url(#vent-ai)" d="m706.9 695-3.4-24.6-10.1-17.3-74.5-66.7" class="vf vf-in"/><path fill="none" stroke="#c8643a" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" marker-end="url(#vent-ao)" d="m618.9 586.4-101.4-85.9-60.9-60-13.6-32.3 6.8-31.8" class="vf vf-out"/></g><g class="co"><path d="M186.5 476.9 120 760" class="ld"/><circle cx="186.5" cy="476.9" r="3.6" class="dt"/><g class="nb"><circle cx="120" cy="760" r="17"/><text x="120" y="766.5" text-anchor="middle">1</text></g><text x="146" y="758" class="lbl">Soffit vents: intake</text><text x="146" y="777" class="sub">Fresh air in, low</text></g><g class="co"><path d="M240.6 464 120 320" class="ld"/><circle cx="240.6" cy="464" r="3.6" class="dt"/><g class="nb"><circle cx="120" cy="320" r="17"/><text x="120" y="326.5" text-anchor="middle">2</text></g><text x="146" y="318" class="lbl">Baffles</text><text x="146" y="337" class="sub">Hold insulation back so</text><text x="146" y="355" class="sub">air can get past it</text></g><g class="co"><path d="M318.4 494.1 330 700" class="ld"/><circle cx="318.4" cy="494.1" r="3.6" class="dt"/><g class="nb"><circle cx="330" cy="700" r="17"/><text x="330" y="706.5" text-anchor="middle">3</text></g><text x="356" y="698" class="lbl">Insulation on the floor</text><text x="356" y="717" class="sub">Keeps house heat out</text><text x="356" y="735" class="sub">of the attic</text></g><g class="co"><path d="M443.6 402.4 120 200" class="ld"/><circle cx="443.6" cy="402.4" r="3.6" class="dt"/><g class="nb"><circle cx="120" cy="200" r="17"/><text x="120" y="206.5" text-anchor="middle">4</text></g><text x="146" y="198" class="lbl">Ridge vent: exhaust</text><text x="146" y="217" class="sub">Warm, damp air out, high</text></g><g class="co"><path d="M555.2 538.4 930 560" class="ld"/><circle cx="555.2" cy="538.4" r="3.6" class="dt"/><g class="nb"><circle cx="930" cy="560" r="17"/><text x="930" y="566.5" text-anchor="middle">5</text></g><text x="956" y="558" class="lbl">Air sweeps the deck</text><text x="956" y="577" class="sub">Dries it out and</text><text x="956" y="595" class="sub">keeps it cooler</text></g><rect width="340" height="230" x="830" y="130" fill="#fbfaf7" stroke="#e8e5e0" stroke-width="1.5" rx="8"/><text x="850" y="164" class="ntb">The code minimum (OH &amp; KY R806.2)</text><text x="850" y="192" class="nt">1 sq ft of net free vent area for</text><text x="850" y="211" class="nt">every 150 sq ft of attic floor, or</text><text x="850" y="230" class="nt">1 per 300 when 40–50% of it is high</text><text x="850" y="249" class="nt">exhaust (within 3 ft of the ridge)</text><text x="850" y="268" class="nt">and the rest is low intake.</text><text x="850" y="302" class="ntb">Example: 1,500 sq ft attic</text><text x="850" y="328" class="nt">÷ 300 = 5 sq ft (720 sq in) total:</text><text x="850" y="347" class="nt">2–2.5 sq ft high, the rest low.</text><g class="bdgbox"><rect width="332" height="28" x="32" y="850" fill="#fff" stroke="#12223d" stroke-width="1.2" rx="14"/><circle cx="50" cy="864" r="5" fill="#bd5728"/></g><text x="62" y="869" class="bdg">Illustration · not a photo of an actual job</text><text x="1160" y="869" class="ft" text-anchor="end">OH &amp; KY R806.2 &amp; R806.3 · GAF: ventilation must meet or exceed code</text></svg>