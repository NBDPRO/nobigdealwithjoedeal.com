<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="vent-t vent-d" role="img" viewBox="0 0 1200 900"><title id="vent-t">How attic ventilation moves air from the soffits to the ridge</title><desc id="vent-d">A house cut in half to show the attic. Cool outside air comes in through vents in the soffits under the roof overhang, travels up through baffles that hold the insulation back from the roof deck, crosses the attic under the deck, and leaves through the ridge vent at the peak. The code minimum is 1 square foot of net free vent area for every 150 square feet of attic floor, or 1 for every 300 when 40 to 50 percent of it is high exhaust within 3 feet of the ridge and the rest is low intake. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ft{font:600 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.bdg{font:700 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ld{stroke:#12223d;stroke-width:1.1;opacity:.75}.dt{fill:#12223d;stroke:#fff;stroke-width:1.6}.nb circle{fill:#bd5728;stroke:#fff;stroke-width:2.5}.nb text{font:800 18px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff}.tag{font:800 12px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff;letter-spacing:.08em}.lstn{font:800 16px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}@media (max-width:640px){.lbl,.sub,.nt,.ntb,.ft,.bdg,.bdgbox,.eb,.hd,.mtxt,.lst,.inset{display:none}.nb{transform-box:fill-box;transform-origin:center;transform:scale(2.1)}.dl{font-size:30px;stroke-width:8px}.dt{r:6px}.ld{stroke-width:2.4}}</style><defs><marker id="vent-ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#bd5728" d="m1 1 8 4-8 4z"/></marker><marker id="vent-ai" markerHeight="4.2" markerWidth="4.2" orient="auto" refX="6" refY="5" viewBox="0 0 10 10"><path fill="#2b78c5" d="m1 1 8 4-8 4z"/></marker><marker id="vent-ao" markerHeight="4.2" markerWidth="4.2" orient="auto" refX="6" refY="5" viewBox="0 0 10 10"><path fill="#c8643a" d="m1 1 8 4-8 4z"/></marker></defs><path fill="#fff" d="M0 0h1200v900H0z"/><text x="40" y="46" class="eb">HOW IT WORKS · ATTIC VENTILATION</text><text x="40" y="84" class="hd">In low at the soffits. Out high at the ridge.</text><path fill="#ece6db" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m687.1 817.3 159.3-111.5V533L687.1 644.5z"/><path stroke="#d6cdbf" d="m687.1 804.7 159.3-111.5"/><path stroke="#d6cdbf" d="m687.1 792.1 159.3-111.5"/><path stroke="#d6cdbf" d="M687.1 779.5 846.4 668"/><path stroke="#d6cdbf" d="m687.1 766.9 159.3-111.5"/><path stroke="#d6cdbf" d="m687.1 754.3 159.3-111.5"/><path stroke="#d6cdbf" d="m687.1 741.7 159.3-111.5"/><path