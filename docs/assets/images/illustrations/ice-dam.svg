<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="ice-t ice-d" role="img" viewBox="0 0 1200 900"><title id="ice-t">How an ice dam forms, and what keeps the water out</title><desc id="ice-d">Two cut-away views of a roof eave in winter. Left: heat leaking up from the house warms the roof deck, snow on the warm part of the roof melts, and the water refreezes on the cold overhang into a ridge of ice. Meltwater pools behind the ice dam and backs up under the shingles, where it can drip into the wall and ceiling. Right: a well-insulated and air-sealed attic floor and soffit-to-ridge ventilation keep the deck closer to outdoor temperature, so snow melts more evenly; ice and water shield under the shingles from the eave to at least 24 inches past the inside of the exterior wall line seals out water that does back up. Ice and water shield does not stop ice dams; it is the backup that keeps their water out. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&