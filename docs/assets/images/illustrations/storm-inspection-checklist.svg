<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="chk-t chk-d" role="img" viewBox="0 0 1200 900"><title id="chk-t">What Joe checks on a storm inspection</title><desc id="chk-d">A house with numbered spots showing what gets checked after a storm: the shingles on every slope for hail hits, creases and missing pieces; the ridge cap and roof vents; pipe boots and the flashing at chimneys, walls and valleys; gutters and downspouts; soft metals like vents and the air-conditioner fins, which show hail size; siding and window trim for dents and cracks; fascia and soffit; and the attic from inside when the homeowner is home, for stains, daylight and ventilation. Every finding is photographed. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ft{font:600 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.bdg{font:700 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ld{stroke:#12223d;stroke-width:1.1;opacity:.75}.dt{fill:#12223d;stroke:#fff;stroke-width:1.6}.nb circle{fill:#bd5728;stroke:#fff;stroke-width:2.5}.nb text{font:800 18px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff}.tag{font:800 12px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff;letter-spacing:.08em}.lstn{font:800 16px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}@media (max-width:640px){.lbl,.sub,.nt,.ntb,.ft,.bdg,.bdgbox,.eb,.hd,.mtxt,.lst,.inset{display:none}.nb{transform-box:fill-box;transform-origin:center;transform:scale(2.1)}.dl{font-size:30px;stroke-width:8px}.dt{r:6px}.ld{stroke-width:2.4}}</style><defs><marker id="chk-ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#bd5728" d="m1 1 8 4-8 4z"/></marker></defs><path fill="#fff" d="M0 0h1200v900H0z"/><text x="40" y="46" class="eb">HOW IT WORKS · AFTER A STORM</text><text x="40" y="84" class="hd">What I check after a storm.</text><path fill="#ddd6ca" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M493.5 785.9 737.6 615V465.9l-244.1 171z"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 774.9 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 763.9 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 752.8 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 741.8 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 730.7 244.1-170.9"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 719.7 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 708.7 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 697.6 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m493.5 686.6 244.1-171"/><path stroke="#d6cdbf" stroke-width=".9" d="m