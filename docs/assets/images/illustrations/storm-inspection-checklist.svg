circle cx="345.8" cy="376" r="15"/><text x="345.8" y="382" text-anchor="middle">1</text></g><g class="lst"><circle cx="880" cy="150" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="156" fill="#fff" class="lstn" text-anchor="middle">1</text></g><text x="906" y="151" class="lbl">Shingles, every slope</text><text x="906" y="171" class="sub">Hail hits, creases, missing pieces</text><g class="nb"><circle cx="428.8" cy="359.2" r="15"/><text x="428.8" y="365.2" text-anchor="middle">2</text></g><g class="lst"><circle cx="880" cy="222" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="228" fill="#fff" class="lstn" text-anchor="middle">2</text></g><text x="906" y="223" class="lbl">Ridge cap &amp; roof vents</text><text x="906" y="243" class="sub">Cracks, lifted caps, dented vents</text><g class="nb"><circle cx="547" cy="411.8" r="15"/><text x="547" y="417.8" text-anchor="middle">3</text></g><g class="lst"><circle cx="880" cy="294" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="300" fill="#fff" class="lstn" text-anchor="middle">3</text></g><text x="906" y="295" class="lbl">Flashing &amp; pipe boots</text><text x="906" y="315" class="sub">Chimney, walls, valleys, boots</text><g class="nb"><circle cx="611.9" cy="570.5" r="15"/><text x="611.9" y="576.5" text-anchor="middle">4</text></g><g class="lst"><circle cx="880" cy="366" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="372" fill="#fff" class="lstn" text-anchor="middle">4</text></g><text x="906" y="367" class="lbl">Gutters &amp; downspouts</text><text x="906" y="387" class="sub">Dents, sags, pulled hangers</text><g class="nb"><circle cx="600.9" cy="760.4" r="15"/><text x="600.9" y="766.4" text-anchor="middle">5</text></g><g class="lst"><circle cx="880" cy="438" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="444" fill="#fff" class="lstn" text-anchor="middle">5</text></g><text x="906" y="439" class="lbl">Soft metals</text><text x="906" y="459" class="sub">Vents and AC fins show hail size</text><g class="nb"><circle cx="623.7" cy="611.9" r="15"/><text x="623.7" y="617.9" text-anchor="middle">6</text></g><g class="lst"><circle cx="880" cy="510" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="516" fill="#fff" class="lstn" text-anchor="middle">6</text></g><text x="906" y="511" class="lbl">Siding &amp; window trim</text><text x="906" y="531" class="sub">Dents, cracks, holes</text><g class="nb"><circle cx="383.7" cy="521.9" r="15"/><text x="383.7" y="527.9" text-anchor="middle">7</text></g><g class="lst"><circle cx="880" cy="582" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="588" fill="#fff" class="lstn" text-anchor="middle">7</text></g><text x="906" y="583" class="lbl">Fascia &amp; soffit</text><text x="906" y="603" class="sub">Rot, gaps, loose trim</text><g class="nb"><circle cx="306.7" cy="508.2" r="15"/><text x="306.7" y="514.2" text-anchor="middle">8</text></g><g class="lst"><circle cx="880" cy="654" r="15" fill="#bd5728" stroke="#fff" stroke-width="2.5"/><text x="880" y="660" fill="#fff" class="lstn" text-anchor="middle">8</text></g><text x="906" y="655" class="lbl">The attic, if you’re home</text><text x="906" y="675" class="sub">Stains, daylight, ventilation</text><text x="865" y="735" class="nt">Every finding gets photographed.</text><text x="865" y="754" class="nt">Free inspection; a written photo</text><text x="865" y="773" class="nt">report is $150 if you want one.</text><g class="bdgbox"><rect width="332" height="28" x="32" y="850" fill="#fff" stroke="#12223d" stroke-width="1.2" rx="14"/><circle cx="50" cy="864" r="5" fill="#bd5728"/></g><text x="62" y="869" class="bdg">Illustration · not a photo of an actual job</text><text x="1160" y="869" class="ft" text-anchor="end">NBD storm inspection, 45–60 minutes</text></svg>