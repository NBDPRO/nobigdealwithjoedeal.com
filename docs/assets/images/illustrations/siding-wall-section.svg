<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="wall-t wall-d" role="img" viewBox="0 0 1200 900"><title id="wall-t">A siding wall, layer by layer</title><desc id="wall-d">A cutaway of an exterior wall. Wood studs carry plywood or OSB sheathing. A water-resistive barrier (housewrap) covers the sheathing, each upper sheet lapped over the one below so water runs out, with flashing tape sealing seams and anything that comes through the wall. A starter strip sets the angle of the first board. Fiber cement lap siding goes on with at least 1 and 1/4 inches of overlap, blind-nailed near the top of each board into the studs so the next board hides the nails, and a strip of joint flashing sits behind each butt joint. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ft{font:600 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.bdg{font:700 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ld{stroke:#12223d;stroke-width:1.1;opacity:.75}.dt{fill:#12223d;stroke:#fff;stroke-width:1.6}.nb circle{fill:#bd5728;stroke:#fff;stroke-width:2.5}.nb text{font:800 18px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff}.tag{font:800 12px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff;letter-spacing:.08em}.lstn{font:800 16px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}@media (max-width:640px){.lbl,.sub,.nt,.ntb,.ft,.bdg,.bdgbox,.eb,.hd,.mtxt,.lst,.inset{display:none}.nb{transform-box:fill-box;transform-origin:center;transform:scale(2.1)}.dl{font-size:30px;stroke-width:8px}.dt{r:6px}.ld{stroke-width:2.4}}</style><defs><marker id="wall-ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#bd5728" d="m1 1 8 4-8 4z"/></marker></defs><path fill="#fff" d="M0 0h1200v900H0z"/><text x="40" y="46" class="eb">HOW IT’S BUILT · SIDING</text><text x="40" y="84" class="hd">What’s behind the siding matters most.</text><path fill="#c8c6c1" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m297.3 591.9 507.5 184.6 39.8-27.8L337.2 564z"/><path fill="#adacab" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m297.3 636.9 507.5 184.6v-45L297.3 591.9z"/><path fill="#8c8d8f" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m804.8 821.5 39.8-27.8v-45l-39.8 27.8z"/><path fill="#d0b286" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m300 576.5 507.4 184.7 18.6-13-507.4-184.7z"/><path fill="#b39b78" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m300 590 507.4 184.7v-13.5L300 576.5z"/><path fill="#918067" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m807.4 774.7 18.6-13v-13.5l-18.6 13z"/><path