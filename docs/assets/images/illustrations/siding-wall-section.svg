th=".8" d="m579.5 698.5-2.4 1.6 4.6-77.4 2.3-1.6z"/><path fill="#edebe6" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m292 530.8 287.5 104.7-2.4 1.6-287.5-104.6z"/><path fill="#d4d3d0" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M296.5 453.4 584 558.1l-4.5 77.4L292 530.8z"/><path fill="#a5a6a8" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m579.5 635.5-2.4 1.6 4.6-77.4 2.3-1.6z"/><path fill="#edebe6" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m292 467.8 287.5 104.7-2.4 1.6-287.5-104.6z"/><path fill="#d4d3d0" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M296.5 390.4 584 495.1l-4.5 77.4L292 467.8z"/><path fill="#a5a6a8" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m579.5 572.5-2.4 1.6 4.6-77.4 2.3-1.6z"/><path fill="#b8bfc8" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m507.5 410.1 50.7 18.4.4-.2-50.7-18.5z"/><path fill="#9fa7b0" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m507.5 473.5 50.7 18.5v-63.5l-50.7-18.4z"/><path fill="#818893" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m558.2 492 .4-.3v-63.4l-.4.2z"/><path fill="#edebe6" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M292 404.8 528.8 491l-2.4 1.7-236.8-86.2z"/><path fill="#d4d3d0" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m296.5 327.4 236.8 86.2-4.5 77.4L292 404.8z"/><path fill="#a5a6a8" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m528.8 491-2.4 1.7 4.5-77.4 2.4-1.7z"/><path fill="#edebe6" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m292 341.8 287.5 104.7-2.4 1.6-287.5-104.6z"/><path fill="#d4d3d0" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M296.5 264.4 584 369.1l-4.5 77.4L292 341.8z"/><path fill="#a5a6a8" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m579.5 446.5-2.4 1.6 4.6-77.4 2.3-1.6z"/><path fill="#edebe6" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M292 278.8 528.8 365l-2.4 1.7-236.8-86.2z"/><path fill="#d4d3d0" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m296.5 201.4 236.8 86.2-4.5 77.4L292 278.8z"/><path fill="#a5a6a8" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m528.8 365-2.4 1.7 4.5-77.4 2.4-1.7z"/><circle cx="362.8" cy="235.1" r="4" fill="#8a929c" stroke="#12223d"/><circle cx="498.1" cy="284.3" r="4" fill="#8a929c" stroke="#12223d"/><g class="dim"><path stroke="#bd5728" stroke-dasharray="3 3" stroke-width=".9" d="m527.1 366.2 64.9 23.6"/><path stroke="#bd5728" stroke-dasharray="3 3" stroke-width=".9" d="m527.1 354.9 64.9 23.6"/><path stroke="#bd5728" stroke-width="1.6" marker-end="url(#wall-ar)" marker-start="url(#wall-ar)" d="M582.1 386.2v-11.3"/><text x="632.1" y="384.5" class="dl" text-anchor="middle">1¼ in min.</text></g><g class="co"><path d="M786.6 488.6 980 210" class="ld"/><circle cx="786.6" cy="488.6" r="3.6" class="dt"/><g class="nb"><circle cx="980" cy="210" r="17"/><text x="980" y="216.5" text-anchor="middle">1</text></g><text x="1006" y="208" class="lbl">Studs</text><text x="1006" y="227" class="sub">16 in apart here; siding</text><text x="1006" y="245" class="sub">nails go into them</text></g><g class="co"><path d="M720.2 421.8 980 320" class="ld"/><circle cx="720.2" cy="421.8" r="3.6" class="dt"/><g class="nb"><circle cx="980" cy="320" r="17"/><text x="980" y="326.5" text-anchor="middle">2</text></g><text x="1006" y="318" class="lbl">Sheathing</text><text x="1006" y="337" class="sub">Plywood or OSB</text></g><g class="co"><path d="M668.5 458 980 430" class="ld"/><circle cx="668.5" cy="458" r="3.6" class="dt"/><g class="nb"><circle cx="980" cy="430" r="17"/><text x="980" y="436.5" text-anchor="middle">3</text></g><text x="1006" y="428" class="lbl">Housewrap (WRB)</text><text x="1006" y="447" class="sub">Upper sheet laps over</text><text x="1006" y="465" class="sub">the lower, shingle-style</text></g><g class="co"><path d="M659.8 428 980 120" class="ld"/><circle cx="659.8" cy="428" r="3.6" class="dt"/><g class="nb"><circle cx="980" cy="120" r="17"/><text x="980" y="126.5" text-anchor="middle">4</text></g><text x="1006" y="118" class="lbl">Flashing tape</text><text x="1006" y="137" class="sub">Seals seams and anything</text><text x="1006" y="155" class="sub">through the wall</text></g><g class="co"><path d="M590.3 694.5 980 760" class="ld"/><circle cx="590.3" cy="694.5" r="3.6" class="dt"/><g class="nb"><circle cx="980" cy="760" r="17"/><text x="980" y="766.5" text-anchor="middle">5</text></g><text x="1006" y="758" class="lbl">Starter strip</text><text x="1006" y="777" class="sub">1¼ in: sets the angle</text><text x="1006" y="795" class="sub">of the first board</text></g><g class="co"><path d="M409.3 531.5 250 640" class="ld"/><circle cx="409.3" cy="531.5" r="3.6" class="dt"/><g class="nb"><circle cx="250" cy="640" r="17"/><text x="250" y="646.5" text-anchor="middle">6</text></g><text x="224" y="638" class="lbl" text-anchor="end">Fiber cement lap siding</text><text x="224" y="657" class="sub" text-anchor="end">At least 1¼ in overlap</text></g><g class="co"><path d="M362.8 235.1 250 220" class="ld"/><circle cx="362.8" cy="235.1" r="3.6" class="dt"/><g class="nb"><circle cx="250" cy="220" r="17"/><text x="250" y="226.5" text-anchor="middle">7</text></g><text x="224" y="218" class="lbl" text-anchor="end">Blind nails</text><text x="224" y="237" class="sub" text-anchor="end">Near the top, into studs;</text><text x="224" y="255" class="sub" text-anchor="end">the next board hides them</text></g><g class="co"><path d="M549.8 451.1 980 620" class="ld"/><circle cx="549.8" cy="451.1" r="3.6" class="dt"/><g class="nb"><circle cx="980" cy="620" r="17"/><text x="980" y="626.5" text-anchor="middle">8</text></g><text x="1006" y="618" class="lbl">Joint flashing</text><text x="1006" y="637" class="sub">Behind every butt joint</text></g><g class="bdgbox"><rect width="332" height="28" x="32" y="850" fill="#fff" stroke="#12223d" stroke-width="1.2" rx="14"/><circle cx="50" cy="864" r="5" fill="#bd5728"/></g><text x="62" y="869" class="bdg">Illustration · not a photo of an actual job</text><text x="1160" y="869" class="ft" text-anchor="end">Per James Hardie HardiePlank HZ5 instructions (HS11117) · OH &amp; KY R703.2, R703.4</text></svg>