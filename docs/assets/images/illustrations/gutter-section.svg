<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="gut-t gut-d" role="img" viewBox="0 0 1200 900"><title id="gut-t">A seamless gutter with hidden hangers and a guard</title><desc id="gut-d">A cutaway of a seamless K-style aluminum gutter hung on the fascia. Hidden hangers clip into the front lip and screw through the back of the gutter into the fascia; Gentek, one gutter maker, calls for hangers no more than 32 inches apart. The drip edge and shingles hang over into the gutter so roof water drops in. The gutter slopes toward the downspout at least a quarter inch for every 10 feet. A gutter guard covers the top to keep leaves out. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ft{font:600 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.bdg{font:700 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-seri