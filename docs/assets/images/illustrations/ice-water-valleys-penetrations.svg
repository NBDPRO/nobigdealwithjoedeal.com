<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="iws-t iws-d" role="img" viewBox="0 0 1200 900"><title id="iws-t">Where ice and water shield goes besides the eaves</title><desc id="iws-d">A roof with the shingles left off so the layers underneath show. A full-width sheet of ice and water shield is centred in the valley, and the regular underlayment on both slopes laps at least 6 inches over its edges. Ice and water shield also runs along the eaves, and around the chimney it covers the deck and turns up the chimney sides at least 5 inches before the step and counter flashing go on. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ft{font:600 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.bdg{font:700 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ld{stroke:#12223d;stroke-width:1.1;opacity:.75}.dt{fill:#12223d;stroke:#fff;stroke-width:1.6}.nb circle{fill:#bd5728;stroke:#fff;stroke-width:2.5}.nb text{font:800 18px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff}.tag{font:800 12px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff;letter-spacing:.08em}.lstn{font:800 16px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}@media (max-width:640px){.lbl,.sub,.nt,.ntb,.ft,.bdg,.bdgbox,.eb,.hd,.mtxt,.lst,.inset{display:none}.nb{transform-box:fill-box;transform-origin:center;transform:scale(2.1)}.dl{font-size:30px;stroke-width:8px}.dt{r:6px}.ld{stroke-width:2.4}}</style><defs><marker id="iws-ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#bd5728" d="m1 1 8 4-8 4z"/></marker></defs><path fill="#fff" d="M0 0h1200v900H0z"/><text x="40" y="46" class="eb">HOW IT’S BUILT · ICE &amp; WATER SHIELD</text><text x="40" y="84" class="hd">Not just the eaves: valleys and chimneys too.</text><path fill="#bb9f78" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M453.8 764.3 560 690l-98-351.4-271.3 190z"/><path fill="#d4b283" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m560 690 310.1 112.9 165.1-255.7L462 338.6z"/><path fill="#c7c6c4" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m560 690 310.1 112.9v25L560 715z"/><path fill="#a0a1a3" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M453.8 764.3 560 690v25l-106.2 74.3z"/><path fill="#343c48" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m560 689.4 310.1 112.9 53.1-82.2-394.7-143.6z"/><path fill="#343c48" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="M453.8 763.7 560 689.4l-31.5-112.9L369.3 688z"/><path fill="#323a46" stroke="#12223d" stroke-linejoin="round" stroke-width=".8" d="m506.9 726.3 137.7-6.4-98-35