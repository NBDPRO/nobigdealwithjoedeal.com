<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="nail-t nail-d" role="img" viewBox="0 0 1200 900"><title id="nail-t">Where shingle nails go: the nailing area</title><desc id="nail-d">A laminated shingle course with its nailing area marked. On GAF Timberline HDZ and UHDZ shingles the instructions call for 4 nails about 6 and 7/8 inches up from the bottom edge, inside the nailing area, with a 5 and 5/8 inch exposure. Three small sections show why: a nail in the nailing area goes through both layers of the shingle and through the top of the shingle below it; a nail set too high misses the shingle below; a nail set too low ends up in the exposed part of the roof, where the next course does not cover it. Illustration, not a photo of an actual job. Layer thicknesses are exaggerated so each one can be seen.</desc><style>.lbl{font:700 17px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.sub{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.nt{font:500 14px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.ntb{font:700 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.dl{font:800 15px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.eb{font:800 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#bd5728;letter-spacing:.16em}.hd{font:800 30px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ft{font:600 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#5d6673}.bdg{font:700 13px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#12223d}.ld{stroke:#12223d;stroke-width:1.1;opacity:.75}.dt{fill:#12223d;stroke:#fff;stroke-width:1.6}.nb circle{fill:#bd5728;stroke:#fff;stroke-width:2.5}.nb text{font:800 18px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff}.tag{font:800 12px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;fill:#fff;letter-spacing:.08em}.lstn{font:800 16px &apos;Montserrat&apos;,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}@media (max-width:640px){.lbl,.sub,.nt,.ntb,.ft,.bdg,.bdgbox,.eb,.hd,.mtxt,.lst,.inset{display:none}.nb{transform-box:fill-box;transform-origin:center;transform:scale(2.1)}.dl{font-size:30px;stroke-width:8px}.dt{r:6px}.ld{stroke-width:2.4}}</style><defs><marker id="nail-ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#bd5728" d="m1 1 8 4-8 4z"/></marker></defs><path fill="#fff" d="M0 0h1200v900H0z"/><text x="40" y="46" class="eb">HOW IT’S BUILT · NAILING</text><text x="40" y="84" class="hd">Four nails. Right in the nailing area.</text><path fill="#272e39" stroke="#12223d" stroke-linejoin="round" stroke-width=".6" d="m673.8 607 94.9-99.9-.5-3.4-94.8 100z"/><path fill="#262a31" stroke="#12223d" stroke-linejoin="round" stroke-width=".6" d="m215 440 458.8 167-.4-3.3-458.8-167z"/><path fill="#4b535d" stroke="#12223d" stroke-linejoin="round" stroke-width=".6" d="m214.6 436.7 458.8 167 94.8-100-458.8-167z"/><path fill="#262a31" d="m214.6 436.7 458.8 167 40.2-42.5-458.8-167z"/><path fill="#545d68" d="m214.6 436.7 10.7 3.9 40.3-42.4-10.8-4z"/><path fill="#262a31" d="m227.2 423.4 10.7 3.9 3.2-3.4-10.7-3.9z" opacity=".3"/><path fill="#5d6670" d="m254.2 451.1 84.1 30.6 40.3-42.4-84.1-30.6z"/><path fill="#262a31" d="m263.1 441.8 84.1 30.6 3.2-3.4-84.1-30.6z" opacity=".3"/><path fill="#545d68" d="m362 490.3 96.2 35.1 40.3-42.5-96.2-35z"/><path fill="#262a31" d="m377.6 474 96.1 35 3.3-3.4-96.2-35z" opacity=".3"/><path fill="#5d6670" d="m482.8 534.3 119 43.3 40.3-42.4-119-43.3z"/><path fill="#262a31" d="m493.1 523.5 119 43.3 3.2-3.4-119-43.3z" opacity=".3"/><path fill="#545d68" d="m623.5 585.5 49.9 18.2 40.2-42.5-49.8-18.1z"/><path fill="#262a31" d="m637.1 571.2 49.9 18.1 3.2-3.4-49.9-18.1z" opacity=".3"/><path stroke="#6c7580" stroke-width=".6" d="m217.1 434 458.8 167"/><path fill="#272e39" stroke="#12223d" stroke-linejoin="round" stroke-width=".6" d="m713.6 561.2 94.9-99.9-.5-3.3-94.8 99.9z"/><path fill="#262a31" stroke="#12223d" stroke-linejoin="round" stroke-width=".6" d="m254.8 394.2 458.8 167-.4-3.3-458.8-167z"/><path fill="#4b535d" stroke="#12223d" stroke-linejoin="round" stroke-width=".6" d="m254.4 390.9 458.8 167L808 458 349.2 291z"/><path fill="#262a31" d="m254.4 390.9 458.8 167 40.3-42.4-458.8-167z"/><path fill="#5d6670" d="m254.4 390.9 16.4 6 40.3-42.4-16.4-6z"/><path fill="#262a31" d="m265.1 379.6 16.4 6 3.3-3.4-16.5-5.9z" opacity=".3"/><path fill="#545d68" d="M303.8 408.9 408.6 447l40.2-42.4-104.7-38.1z"/><path fill="#262a31" d="m314.6 397.6 104.7 38.1 3.2-3.4-104.7-38.1z" opacity=".3"/><path fill="#47505a" d="m434.8 456.6 90.3 32.9 40.3-42.5-90.3-32.8z"/><path fill="#262a31" d="m444.1 446.8 90.3 32.9 3.3-3.4-90.4-32.9z" opacity=".3"/><path fill="#545d68" d="m557.2 501.1 73.5 26.8 40.3-42.4-73.6-26.8z"/><path fill="#262a31" d="m565.4 492.4 73.6 26.8 3.2-3.4-73.5-26.8z" opacity=".3"/><path fill="#4b535d" d="m647.9 534.1 59.4 21.7 40.3-42.4-59.4-21.7z"/><path fill="#262a31" d="m661 520.3 59.5 21.7 3.2-3.4-59.5-21.7z" opacity=".3"/><path stroke="#6c7580" stroke-width=".6" d="m256.9 388.3 458.8 167"/><path fill="#bd5728" d="m298.2 344.5 458.8 167 10.7-11.3-458.8-167z" opacity=".2"/><path stroke="#bd5728" stroke-dasharray="6 4" stroke-width="1.4" d="m298.2 344.5 458.8 167"/><path stroke="#bd5728" stroke-dasharray="6 4" stroke-width="1.4" d="m308.9 333.2 458.8 167"/><circle cx="321" cy="345.2" r="7" fill="#d9dde2" stroke="#12223d" stroke-width="1.4"/><circle cx="321" cy="345.2" r="2" fill="#12223d"/><circle cx="455" cy="394" r="7" fill="#d9dde2" stroke="#12223d" stroke-width="1.4"/><circle cx="455" cy="394" r="2" fill="#12223d"/><circle cx="610.9" cy="450.7" r="7" fill="#d9dde2" stroke="#12223d" stroke-width="1.4"/><circle cx="610.9" cy="450.7" r="2" fill="#12223d"/><circle cx="744.9" cy="499.5" r="7" fill="#d9dde2" stroke="#12223d" stroke-width="1.4"/><circle cx="744.9" cy="499.5" r="2" fill="#12223d"/><g class="dim"><path stroke="#bd5728" stroke-dasharray="3 3" stroke-width=".9" d="m713.2 557.9 44 16"/><path stroke="#bd5728" stroke-dasharray="3 3" stroke-width=".9" d="m762.4 506.1 44 16"/><path stroke="#bd5728" stroke-width="1.6" marker-end="url(#nail-ar)" marker-start="url(#nail-ar)" d="m750.5 571.5 49.2-51.9"/><text x="823.1" y="551.6" class="dl" text-anchor="middle">≈ 6⅞ in</text></g><g class="dim"><path stroke="#bd5728" stroke-dasharray="3 3" stroke-width=".9" d="m673.4 603.7 44 16"/><path stroke="#bd5728" stroke-dasharray="3 3" stroke-width=".9" d="m713.6 561.2 44 16.1"/><path stroke="#bd5728" stroke-width="1.6" marker-end="url(#nail-ar)" marker-start="url(#nail-ar)" d="m710.6 617.2 40.3-42.4"/><text x="770.8" y="604" class="dl" text-anchor="middle">5⅝ in</text></g><g class="co"><path d="M539.5 420.6 520 175" class="ld"/><circle cx="539.5" cy="420.6" r="3.6" class="dt"/><g class="nb"><circle cx="520" cy="175" r="17"/><text x="520" y="181.5" text-anchor="middle">1</text></g><text x="494" y="173" class="lbl" text-anchor="end">The nailing area</text><text x="494" y="192" class="sub" text-anchor="end">Printed on the shingle; 4 nails</text><text x="494" y="210" class="sub" text-anchor="end">here (6 for the enhanced pattern)</text></g><g class="co"><path d="M302.4 443.3 180 540" class="ld"/><circle cx="302.4" cy="443.3" r="3.6" class="dt"/><g class="nb"><circle cx="180" cy="540" r="17"/><text x="180" y="546.5" text-anchor="middle">2</text></g><text x="154" y="538" class="lbl" text-anchor="end">Exposure</text><text x="154" y="557" class="sub" text-anchor="end">The part you see:</text><text x="154" y="575" class="sub" text-anchor="end">5⅝ in per course</text></g><text x="820" y="180" class="nt">Nail height on GAF Timberline</text><text x="820" y="199" class="nt">HDZ / UHDZ: about 6⅞ in up</text><text x="820" y="218" class="nt">from the bottom edge.</text><text x="820" y="237" class="nt">TAMKO Heritage uses its own</text><text x="820" y="256" class="nt">line (6⅛ in): always the</text><text x="820" y="275" class="nt">maker’s wrapper, not habit.</text><rect width="360" height="200" x="40" y="625" fill="#fbfaf7" stroke="#e8e5e0" stroke-width="1.5" rx="8"/><circle cx="66" cy="653" r="12" fill="#1a3057"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="m60 653 4.5 4.5 8-9"/><text x="88" y="659" class="ntb">In the nailing area</text><path fill="#d7b585" stroke="#12223d" d="M50 757h340v10H50z"/><path fill="#4b535d" stroke="#12223d" d="m61.7 757 165.6-3v-15l-165.6 3Z"/><path fill="#5d6670" stroke="#12223d" d="m132 742 165.6-3v-15L132 727Z"/><path stroke="#12223d" stroke-width="3" d="M217.9 725.4V769"/><rect width="16" height="5" x="209.9" y="720.4" fill="#1a3057" rx="2"/><path fill="#4b535d" stroke="#12223d" d="m202.3 727 165.6-3v-15l-165.6 3Z"/><text x="60" y="795" class="nt">Through both layers and the</text><text x="60" y="814" class="nt">top of the shingle below</text><rect width="360" height="200" x="420" y="625" fill="#fbfaf7" stroke="#e8e5e0" stroke-width="1.5" rx="8"/><circle cx="446" cy="653" r="12" fill="#bd5728"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.6" d="m441 648 10 10m0-10-10 10"/><text x="468" y="659" class="ntb">Too high</text><path fill="#d7b585" stroke="#12223d" d="M430 757h340v10H430z"/><path fill="#4b535d" stroke="#12223d" d="m441.7 757 165.6-3v-15l-165.6 3Z"/><path fill="#5d6670" stroke="#12223d" d="m512 742 165.6-3v-15L512 727Z"/><path stroke="#12223d" stroke-width="3" d="M626.7 724.9V769"/><rect width="16" height="5" x="618.7" y="719.9" fill="#bd5728" rx="2"/><path fill="#4b535d" stroke="#12223d" d="m582.3 727 165.6-3v-15l-165.6 3Z"/><text x="440" y="795" class="nt">Misses the shingle below:</text><text x="440" y="814" class="nt">not the maker’s pattern</text><rect width="360" height="200" x="800" y="625" fill="#fbfaf7" stroke="#e8e5e0" stroke-width="1.5" rx="8"/><circle cx="826" cy="653" r="12" fill="#bd5728"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.6" d="m821 648 10 10m0-10-10 10"/><text x="848" y="659" class="ntb">Too low</text><path fill="#d7b585" stroke="#12223d" d="M810 757h340v10H810z"/><path fill="#4b535d" stroke="#12223d" d="m821.7 757 165.6-3v-15l-165.6 3Z"/><path fill="#5d6670" stroke="#12223d" d="m892 742 165.6-3v-15L892 727Z"/><path stroke="#12223d" stroke-width="3" d="M944.8 726v43"/><rect width="16" height="5" x="936.8" y="721" fill="#bd5728" rx="2"/><path fill="#4b535d" stroke="#12223d" d="m962.3 727 165.6-3v-15l-165.6 3Z"/><text x="820" y="795" class="nt">Lands in the exposed part:</text><text x="820" y="814" class="nt">the next course won’t cover it</text><g class="bdgbox"><rect width="332" height="28" x="32" y="850" fill="#fff" stroke="#12223d" stroke-width="1.2" rx="14"/><circle cx="50" cy="864" r="5" fill="#bd5728"/></g><text x="62" y="869" class="bdg">Illustration · not a photo of an actual job</text><text x="1160" y="869" class="ft" text-anchor="end">Per GAF Timberline HDZ/UHDZ instructions (RESTL622) · TAMKO Heritage instructions</text></svg>